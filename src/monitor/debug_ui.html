<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>elephc monitor · debugger</title>
<style>
:root{--bg:#10141c;--panel:#171d28;--line:#2a3342;--text:#d7deea;--muted:#8492a6;--accent:#6ee7ff;--stop:#ffbd6b;--ok:#7ee787;--bad:#ff7b72}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
header{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:14px;margin:0;color:var(--accent);font-weight:600}
header .status{margin-left:auto;color:var(--muted)}
header .status.stopped{color:var(--stop)}
main{display:grid;grid-template-columns:220px minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr) 190px;height:calc(100vh - 42px)}
#files{border-right:1px solid var(--line);overflow:auto;padding:7px 0;background:var(--panel)}
#files button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:5px 12px;cursor:pointer;font:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#files button:hover,#files button.active{background:#223047;color:var(--accent)}
#code{overflow:auto;padding:10px 0;background:#0d1118}
.code-line{display:flex;min-height:20px;white-space:pre}
.code-line .num{width:58px;flex:none;text-align:right;padding-right:12px;color:var(--muted);cursor:pointer;user-select:none}
.code-line .num:hover{color:var(--accent)}
.code-line.breakpoint .num{color:var(--bad);font-weight:700}
.code-line.current{background:#27364c}
.code-line .src{padding-right:14px}
#side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px}
#side h2{font-size:12px;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.08em}
#controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#controls button{background:#223047;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer;font:inherit}
#controls button:hover{border-color:var(--accent);color:var(--accent)}
#controls button:disabled{opacity:.35;cursor:default}
.frame,.var{padding:2px 5px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame:hover,.var:hover{background:#223047}
.frame.active{background:#2b4262;color:var(--accent)}
.var .value{color:var(--ok);margin-left:6px}
.var .children{margin-left:14px;border-left:1px solid var(--line);padding-left:6px}
.bp-row,.fn-row,.data-row,.watch-row{padding:3px 0;border-bottom:1px solid #202938}
.bp-row .head,.fn-row .head,.data-row .head,.watch-row .head{display:flex;align-items:center;gap:4px;min-width:0}
.bp-row .where,.fn-row .name,.data-row .name{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-row input,.fn-row input,.watch-row input{min-width:0;flex:1;background:#0d1118;border:1px solid #2a3342;color:var(--text);border-radius:3px;padding:2px 4px;font:inherit}
.bp-row .remove,.fn-row .remove,.data-row .remove,.watch-row .remove{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:0 3px}
.bp-row .remove:hover,.fn-row .remove:hover,.data-row .remove:hover,.watch-row .remove:hover{color:var(--bad)}
.bp-row .message,.fn-row .message,.data-row .message{color:var(--bad);font-size:11px;padding-left:4px;word-break:break-word}
.bp-row .ok,.fn-row .ok,.data-row .ok{color:var(--ok)}
#side label{display:flex;align-items:center;gap:5px;color:var(--text);margin:2px 0}
#side .filter-class{width:100%;background:#0d1118;border:1px solid #2a3342;color:var(--text);border-radius:3px;padding:3px 5px;font:inherit;margin-top:3px}
.watch{padding:2px 5px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch:hover{background:#223047}
.watch .result{color:var(--ok);margin-left:6px}
#console{grid-column:1 / -1;border-top:1px solid var(--line);background:#0b0f16;padding:8px 12px;overflow:auto;white-space:pre-wrap}
#console .err{color:var(--bad)}
#console .meta{color:var(--muted)}
@media(max-width:1000px){main{grid-template-columns:150px minmax(0,1fr) 300px}}
</style>
</head>
<body>
<header><h1>elephc monitor · debugger</h1><span class="status" id="status">connecting…</span></header>
<main>
  <nav id="files"></nav>
  <section id="code"><div id="code-body"></div></section>
  <aside id="side">
    <div id="controls">
      <button id="continue">continue</button><button id="pause">pause</button>
      <button id="next">next</button><button id="stepIn">step in</button><button id="stepOut">step out</button>
    </div>
    <h2>Breakpoints</h2><div id="breakpoints"></div>
    <h2>Exceptions</h2>
    <label><input type="checkbox" id="exc-uncaught" checked> uncaught</label>
    <label><input type="checkbox" id="exc-caught"> caught</label>
    <label><input type="checkbox" id="exc-throw"> throw</label>
    <input class="filter-class" id="exc-class" placeholder="class filter (optional)">
    <h2>Function breakpoints</h2>
    <div class="head" style="display:flex;gap:4px"><input id="fn-name" placeholder="function name" style="min-width:0;flex:1;background:#0d1118;border:1px solid #2a3342;color:#d7deea;border-radius:3px;padding:3px 5px;font:inherit"><input id="fn-condition" placeholder="condition" style="min-width:0;flex:1;background:#0d1118;border:1px solid #2a3342;color:#d7deea;border-radius:3px;padding:3px 5px;font:inherit"><button id="fn-add">add</button></div>
    <div id="function-breakpoints"></div>
    <h2>Data breakpoints</h2><div id="data-breakpoints"></div>
    <h2>Watch</h2>
    <div style="display:flex;gap:5px"><input id="watch-expr" placeholder="$value > 3" style="min-width:0;flex:1;background:#0d1118;border:1px solid #2a3342;color:#d7deea;border-radius:3px;padding:3px 5px;font:inherit"><button id="watch-add">add</button></div>
    <div id="watches"></div>
    <h2>Evaluate</h2>
    <div style="display:flex;gap:5px"><input id="expr" placeholder="$value, count($items)" style="min-width:0;flex:1;background:#0d1118;border:1px solid #2a3342;color:#d7deea;border-radius:3px;padding:4px 6px;font:inherit"><button id="eval">run</button></div>
    <div id="eval-result" style="color:#7ee787;padding:4px 2px;word-break:break-word"></div>
    <h2>Stack</h2><div id="stack"></div>
    <h2>Variables</h2><div id="variables"></div>
  </aside>
  <section id="console"></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (text) => String(text).replace(/[&<>"]/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]));
const basename = (path) => { const parts = String(path || "").split("/"); return parts[parts.length - 1] || path || "<source>"; };
const state = {
  seq: 0, since: 0, sources: [], current: null, content: "", stopped: false, frame: null,
  breakpoints: new Map(), functionBreakpoints: [], dataBreakpoints: [], watches: [],
  localsRef: 0, pending: new Map(),
};

function status(text, stopped=false){ const el=$("status"); el.textContent=text; el.className="status"+(stopped?" stopped":""); }
function log(text, cls=""){ const el=$("console"); const line=document.createElement("div"); line.className=cls; line.textContent=text; el.appendChild(line); el.scrollTop=el.scrollHeight; }

async function send(command, args, handler){
  state.seq += 1;
  const seq = state.seq;
  const message = {seq, type:"request", command};
  if (args !== undefined) message.arguments = args;
  if (handler) state.pending.set(seq, handler);
  const r = await fetch("/dap/request", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(message)});
  if (!r.ok) { state.pending.delete(seq); log("request failed: "+command, "err"); }
  return seq;
}
function request(command, args, handler){ send(command,args,handler).catch((e)=>{ log(String(e),"err"); }); }

async function poll(){
  while(true){
    try{
      const r = await fetch("/dap/events?since="+state.since);
      const data = await r.json();
      state.since = data.next;
      for (const message of data.events) handle(message);
      if (data.closed){ status("debuggee exited"); return; }
    }catch(e){ log("event stream failed: "+e,"err"); await new Promise((r)=>setTimeout(r,1000)); }
  }
}

function handle(message){
  if (message.type === "event") return handleEvent(message);
  if (message.type === "response") return handleResponse(message);
}
function handleEvent(event){
  const body = event.body || {};
  switch(event.event){
    case "initialized":
      sendExceptionFilters();
      request("configurationDone", {});
      break;
    case "stopped":
      state.stopped = true; status("stopped · "+(body.reason||"breakpoint"), true);
      setControls(true);
      request("stackTrace", {threadId: body.threadId});
      break;
    case "continued":
      state.stopped = false; status("running"); setControls(false); break;
    case "output": {
      const text = body.output || "";
      log(text, body.category === "stderr" ? "err" : "");
      break;
    }
    case "exited":
      status("exited ("+(body.exitCode ?? 0)+")"); break;
    case "terminated":
      status("terminated"); setControls(false); break;
  }
}
function handleResponse(response){
  const pending = state.pending.get(response.request_seq);
  if (pending){ state.pending.delete(response.request_seq); pending(response); return; }
  if (!response.success){ log("DAP error: "+(response.message||response.command), "err"); return; }
  const command = response.command, body = response.body || {};
  switch(command){
    case "initialize":
      request("loadedSources", {});
      request("launch", {program:"", stopOnEntry:true});
      break;
    case "loadedSources":
      state.sources = (body.sources||[]).filter((source)=>source.path);
      renderFiles();
      if (state.sources.length) selectSource(state.sources[0]);
      break;
    case "source":
      state.content = body.content || "";
      renderCode();
      break;
    case "stackTrace":
      renderStack(body.stackFrames||[]);
      break;
    case "scopes": {
      const scope = (body.scopes||[]).find((scope)=>scope.variablesReference);
      if (scope){
        state.localsRef = scope.variablesReference;
        request("variables", {variablesReference: scope.variablesReference}, (r)=>{
          if (r.success) renderVariables(r.body.variables||[]);
        });
      }
      break;
    }
    case "evaluate":
      $("eval-result").textContent = (body.result||"") + (body.type ? "  · "+body.type : "");
      break;
  }
}

function renderFiles(){
  const nav = $("files"); nav.innerHTML = "";
  for (const source of state.sources){
    const button = document.createElement("button");
    button.textContent = source.name || source.path;
    button.title = source.path;
    button.onclick = ()=>selectSource(source);
    if (state.current && state.current.path === source.path) button.className = "active";
    nav.appendChild(button);
  }
  if (!state.sources.length) nav.textContent = "no loaded sources";
}
function selectSource(source){
  state.current = source;
  state.content = "";
  renderFiles(); renderCode();
  request("source", {source:{path:source.path, sourceReference:source.sourceReference}, sourceReference:source.sourceReference||0});
}
function renderCode(){
  const lines = state.content ? state.content.split("\n") : [];
  const body = $("code-body"); body.innerHTML = "";
  if (!lines.length){ body.innerHTML = '<div class="code-line"><span class="src">loading source…</span></div>'; return; }
  const path = state.current && state.current.path;
  const marked = (path && state.breakpoints.get(path)) || new Map();
  lines.forEach((text, index)=>{
    const line = index + 1;
    const row = document.createElement("div"); row.className = "code-line";
    if (marked.has(line)) row.classList.add("breakpoint");
    if (state.frame && state.frame.line === line && state.frame.source && state.frame.source.path === path) row.classList.add("current");
    const num = document.createElement("span"); num.className = "num"; num.textContent = line;
    num.onclick = ()=>toggleBreakpoint(line);
    const src = document.createElement("span"); src.className = "src"; src.textContent = text;
    row.appendChild(num); row.appendChild(src); body.appendChild(row);
  });
}

function sortedBreakpoints(path){
  const map = state.breakpoints.get(path) || new Map();
  return [...map.entries()].sort((left,right)=>left[0]-right[0]);
}
function allBreakpoints(){
  const out = [];
  for (const [path, map] of state.breakpoints){
    for (const [line, bp] of map) out.push({path, line, ...bp});
  }
  return out.sort((left,right)=>left.path.localeCompare(right.path) || left.line-right.line);
}
function renderBreakpoints(){
  const panel = $("breakpoints"); panel.innerHTML = "";
  const entries = allBreakpoints();
  if (!entries.length){ panel.textContent = "click a line number"; return; }
  for (const entry of entries){
    const row = document.createElement("div"); row.className = "bp-row";
    const head = document.createElement("div"); head.className = "head";
    const where = document.createElement("span"); where.className = "where"; where.textContent = basename(entry.path)+":"+entry.line; where.title = entry.path;
    const condition = document.createElement("input"); condition.placeholder = "condition"; condition.value = entry.condition || "";
    condition.onchange = ()=>{ entry.condition = condition.value.trim(); sendBreakpoints(entry.path); };
    const hits = document.createElement("input"); hits.placeholder = "hits"; hits.value = entry.hitCondition || ""; hits.style.flex = "0 0 54px";
    hits.onchange = ()=>{ entry.hitCondition = hits.value.trim(); sendBreakpoints(entry.path); };
    const remove = document.createElement("button"); remove.className = "remove"; remove.textContent = "×"; remove.title = "remove breakpoint";
    remove.onclick = ()=>{ state.breakpoints.get(entry.path)?.delete(entry.line); renderBreakpoints(); renderCode(); sendBreakpoints(entry.path); };
    head.appendChild(where); head.appendChild(condition); head.appendChild(hits); head.appendChild(remove);
    row.appendChild(head);
    if (entry.verified === false){
      const message = document.createElement("div"); message.className = "message"; message.textContent = entry.message || "unverified";
      row.appendChild(message);
    }
    panel.appendChild(row);
  }
}
function sendBreakpoints(path){
  const requested = sortedBreakpoints(path).map(([line, bp])=>{
    const out = {line};
    if (bp.condition) out.condition = bp.condition;
    if (bp.hitCondition) out.hitCondition = bp.hitCondition;
    return out;
  });
  request("setBreakpoints", {source:{path}, breakpoints:requested}, (response)=>{
    if (!response.success){ log("breakpoint error: "+(response.message||"setBreakpoints"), "err"); return; }
    const map = state.breakpoints.get(path) || new Map();
    (response.body.breakpoints||[]).forEach((bp, index)=>{
      const line = requested[index] ? requested[index].line : bp.line;
      const entry = map.get(line);
      if (entry){ entry.verified = bp.verified !== false; entry.message = bp.message || ""; }
    });
    renderBreakpoints(); renderCode();
  });
}
function toggleBreakpoint(line){
  if (!state.current) return;
  const path = state.current.path;
  let map = state.breakpoints.get(path);
  if (!map){ map = new Map(); state.breakpoints.set(path, map); }
  if (map.has(line)) map.delete(line);
  else map.set(line, {condition:"", hitCondition:"", verified:true, message:""});
  if (map.size === 0) state.breakpoints.delete(path);
  renderBreakpoints(); renderCode();
  sendBreakpoints(path);
}

function sendExceptionFilters(){
  const filters = [];
  for (const name of ["uncaught","caught","throw"]) if ($("exc-"+name).checked) filters.push(name);
  const condition = $("exc-class").value.trim();
  const filterOptions = condition ? filters.map((filter)=>({filter, condition})) : [];
  request("setExceptionBreakpoints", {filters, filterOptions});
}

function sendFunctionBreakpoints(){
  const requested = state.functionBreakpoints.map(({name, condition})=>{
    const out = {name};
    if (condition) out.condition = condition;
    return out;
  });
  request("setFunctionBreakpoints", {breakpoints:requested}, (response)=>{
    if (!response.success){ log("function breakpoint error: "+(response.message||"setFunctionBreakpoints"), "err"); return; }
    (response.body.breakpoints||[]).forEach((bp, index)=>{
      if (state.functionBreakpoints[index]){
        state.functionBreakpoints[index].verified = bp.verified !== false;
        state.functionBreakpoints[index].message = bp.message || "";
      }
    });
    renderFunctionBreakpoints();
  });
}
function renderFunctionBreakpoints(){
  const panel = $("function-breakpoints"); panel.innerHTML = "";
  if (!state.functionBreakpoints.length){ panel.textContent = "none"; return; }
  state.functionBreakpoints.forEach((entry, index)=>{
    const row = document.createElement("div"); row.className = "fn-row";
    const head = document.createElement("div"); head.className = "head";
    const name = document.createElement("span"); name.className = "name"; name.textContent = entry.name;
    const condition = document.createElement("input"); condition.placeholder = "condition"; condition.value = entry.condition || "";
    condition.onchange = ()=>{ entry.condition = condition.value.trim(); sendFunctionBreakpoints(); };
    const remove = document.createElement("button"); remove.className = "remove"; remove.textContent = "×";
    remove.onclick = ()=>{ state.functionBreakpoints.splice(index,1); renderFunctionBreakpoints(); sendFunctionBreakpoints(); };
    head.appendChild(name); head.appendChild(condition); head.appendChild(remove);
    row.appendChild(head);
    if (entry.verified === false){
      const message = document.createElement("div"); message.className = "message"; message.textContent = entry.message || "unverified";
      row.appendChild(message);
    }
    panel.appendChild(row);
  });
}

function applyDataBreakpointInfo(response, name){
  if (!response.success || !response.body || !response.body.dataId){
    log("cannot watch "+name+": "+((response.body && response.body.description) || response.message || "not watchable"), "err");
    return;
  }
  const accessTypes = response.body.accessTypes || [];
  const accessType = accessTypes.includes("write") ? "write" : (accessTypes[0] || "write");
  state.dataBreakpoints.push({dataId: response.body.dataId, description: response.body.description || name, accessType, verified:true, message:""});
  renderDataBreakpoints(); sendDataBreakpoints();
}
function sendDataBreakpoints(){
  const requested = state.dataBreakpoints.map(({dataId, accessType})=>({dataId, accessType}));
  request("setDataBreakpoints", {breakpoints:requested}, (response)=>{
    if (!response.success){ log("data breakpoint error: "+(response.message||"setDataBreakpoints"), "err"); return; }
    (response.body.breakpoints||[]).forEach((bp, index)=>{
      if (state.dataBreakpoints[index]){
        state.dataBreakpoints[index].verified = bp.verified !== false;
        state.dataBreakpoints[index].message = bp.message || "";
      }
    });
    renderDataBreakpoints();
  });
}
function renderDataBreakpoints(){
  const panel = $("data-breakpoints"); panel.innerHTML = "";
  if (!state.dataBreakpoints.length){ panel.textContent = "none — use watch on a local"; return; }
  state.dataBreakpoints.forEach((entry, index)=>{
    const row = document.createElement("div"); row.className = "data-row";
    const head = document.createElement("div"); head.className = "head";
    const name = document.createElement("span"); name.className = "name"; name.textContent = entry.description; name.title = entry.accessType;
    const remove = document.createElement("button"); remove.className = "remove"; remove.textContent = "×";
    remove.onclick = ()=>{ state.dataBreakpoints.splice(index,1); renderDataBreakpoints(); sendDataBreakpoints(); };
    head.appendChild(name); head.appendChild(remove);
    row.appendChild(head);
    if (entry.verified === false){
      const message = document.createElement("div"); message.className = "message"; message.textContent = entry.message || "unverified";
      row.appendChild(message);
    }
    panel.appendChild(row);
  });
}

function renderStack(frames){
  const stack = $("stack"); stack.innerHTML = "";
  if (!frames.length){ stack.textContent = "no frames"; state.frame = null; return; }
  state.frame = frames[0];
  frames.forEach((frame, index)=>{
    const row = document.createElement("div"); row.className = "frame" + (index===0?" active":"");
    row.textContent = (frame.name||"<unknown>") + (frame.source ? " · "+(frame.source.name||frame.source.path)+":"+frame.line : "");
    row.onclick = ()=>{
      state.frame = frame;
      [...stack.children].forEach((child)=>child.classList.remove("active")); row.classList.add("active");
      if (frame.source && frame.source.path !== (state.current&&state.current.path)) loadFrameSource(frame.source);
      renderCode();
      request("scopes", {frameId: frame.id});
      evaluateWatches();
    };
    stack.appendChild(row);
  });
  const top = frames[0];
  if (top.source && top.source.path !== (state.current&&state.current.path)) loadFrameSource(top.source);
  request("scopes", {frameId: top.id});
  evaluateWatches();
}
function loadFrameSource(source){
  const known = state.sources.find((candidate)=>candidate.path === source.path);
  if (known){ selectSource(known); return; }
  state.current = {path:source.path, name:source.name, sourceReference:source.sourceReference||0};
  state.content = "";
  request("source", {source:{path:source.path, sourceReference:source.sourceReference||0}, sourceReference:source.sourceReference||0});
}

function renderVariableList(variables, container, topLevel){
  if (!variables.length){ container.textContent = topLevel ? "no locals" : "(empty)"; return; }
  for (const variable of variables){
    const row = document.createElement("div"); row.className = "var";
    const name = document.createElement("span"); name.textContent = (variable.name||"")+" = ";
    const value = document.createElement("span"); value.className = "value"; value.textContent = variable.value||"";
    row.appendChild(name); row.appendChild(value);
    if (topLevel && state.localsRef){
      const watch = document.createElement("button"); watch.className = "remove"; watch.textContent = "watch"; watch.title = "break when this local is written";
      watch.onclick = (event)=>{ event.stopPropagation(); request("dataBreakpointInfo", {variablesReference: state.localsRef, name: variable.name}, (response)=>applyDataBreakpointInfo(response, variable.name)); };
      row.appendChild(watch);
    }
    if (variable.variablesReference){
      const children = document.createElement("div"); children.className = "children"; children.style.display = "none";
      row.onclick = ()=>{
        if (children.style.display === "none"){
          children.style.display = "block";
          request("variables", {variablesReference: variable.variablesReference}, (response)=>{
            if (response.success) renderVariableList(response.body.variables||[], children, false);
          });
        } else children.style.display = "none";
      };
      row.appendChild(children);
    }
    container.appendChild(row);
  }
}
function renderVariables(variables){
  const panel = $("variables"); panel.innerHTML = "";
  renderVariableList(variables, panel, true);
}

function evaluateWatches(){
  if (!state.stopped || !state.frame){ state.watches.forEach((watch)=>{ watch.result = ""; }); renderWatches(); return; }
  state.watches.forEach((watch, index)=>{
    request("evaluate", {expression:watch.expression, frameId:state.frame.id, context:"watch"}, (response)=>{
      watch.result = response.success ? (response.body.result||"") : (response.message||"error");
      if (state.watches[index] === watch) renderWatches();
    });
  });
}
function renderWatches(){
  const panel = $("watches"); panel.innerHTML = "";
  if (!state.watches.length){ panel.textContent = "none"; return; }
  state.watches.forEach((watch, index)=>{
    const row = document.createElement("div"); row.className = "watch-row";
    const head = document.createElement("div"); head.className = "head";
    const expr = document.createElement("span"); expr.className = "name"; expr.textContent = watch.expression; expr.title = watch.expression;
    const result = document.createElement("span"); result.className = "result"; result.textContent = watch.result || "";
    const remove = document.createElement("button"); remove.className = "remove"; remove.textContent = "×";
    remove.onclick = ()=>{ state.watches.splice(index,1); renderWatches(); };
    head.appendChild(expr); head.appendChild(result); head.appendChild(remove);
    row.appendChild(head); panel.appendChild(row);
  });
}

function setControls(enabled){ for (const id of ["continue","next","stepIn","stepOut"]) $(id).disabled = !enabled; }
function evaluateExpression(){
  if (!state.frame){ $("eval-result").textContent = "not stopped"; return; }
  const expression = $("expr").value.trim();
  if (!expression) return;
  request("evaluate", {expression, frameId: state.frame.id, context:"watch"});
}
function addWatch(){
  const expression = $("watch-expr").value.trim();
  if (!expression) return;
  state.watches.push({expression, result:""});
  $("watch-expr").value = "";
  renderWatches(); evaluateWatches();
}
function addFunctionBreakpoint(){
  const name = $("fn-name").value.trim();
  if (!name) return;
  state.functionBreakpoints.push({name, condition:$("fn-condition").value.trim(), verified:true, message:""});
  $("fn-name").value = ""; $("fn-condition").value = "";
  renderFunctionBreakpoints(); sendFunctionBreakpoints();
}

$("eval").onclick = evaluateExpression;
$("expr").addEventListener("keydown", (event)=>{ if (event.key === "Enter") evaluateExpression(); });
$("watch-add").onclick = addWatch;
$("watch-expr").addEventListener("keydown", (event)=>{ if (event.key === "Enter") addWatch(); });
$("fn-add").onclick = addFunctionBreakpoint;
$("fn-name").addEventListener("keydown", (event)=>{ if (event.key === "Enter") addFunctionBreakpoint(); });
$("fn-condition").addEventListener("keydown", (event)=>{ if (event.key === "Enter") addFunctionBreakpoint(); });
for (const name of ["uncaught","caught","throw"]) $("exc-"+name).addEventListener("change", sendExceptionFilters);
$("exc-class").addEventListener("change", sendExceptionFilters);
$("continue").onclick = ()=>{ setControls(false); request("continue", {threadId:1}); };
$("pause").onclick = ()=>request("pause", {threadId:1});
$("next").onclick = ()=>{ setControls(false); request("next", {threadId:1}); };
$("stepIn").onclick = ()=>{ setControls(false); request("stepIn", {threadId:1}); };
$("stepOut").onclick = ()=>{ setControls(false); request("stepOut", {threadId:1}); };
setControls(false);
renderBreakpoints(); renderFunctionBreakpoints(); renderDataBreakpoints(); renderWatches();
poll();
request("initialize", {clientID:"elephc-monitor-web", adapterID:"elephc", linesStartAt1:true, columnsStartAt1:true});
</script>
</body>
</html>
