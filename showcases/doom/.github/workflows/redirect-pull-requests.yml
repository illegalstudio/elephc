name: Redirect pull requests

# This repository is a read-only mirror published from showcases/doom in
# illegalstudio/elephc, so a pull request here could never be merged: point it there.
# pull_request_target only reads the event; it never checks out the pull request's code.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  redirect:
    name: Close with a pointer to elephc
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Thank you! This repository is a read-only mirror of [showcases/doom](https://github.com/illegalstudio/elephc/tree/main/showcases/doom) in elephc, published automatically from its main branch. Please open your pull request against [illegalstudio/elephc](https://github.com/illegalstudio/elephc) instead."
