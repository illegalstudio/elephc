[[limitations]]
title = "Static subset, AOT only"
notes = "Ordinary source is compiled ahead of time with no opcode fallback; runtime code loading exists only through the experimental eval() interpreter bridge."

[[limitations]]
title = "Coverage measured against a pinned baseline"
notes = "Builtin percentages are computed against the vendored PHP CLI snapshot (version and extension set recorded in the page header). PHP modules outside that snapshot are not counted."

[[limitations]]
title = "Three native targets"
notes = "Binaries target macOS ARM64, Linux ARM64, and Linux x86_64; PHP itself runs on many more platforms."
