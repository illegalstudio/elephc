# Hand-curated side of docs/php/compatibility.md (language constructs,
# extension-level subsystems, known limitations). Builtin-function coverage is
# NOT listed here — it is computed automatically from builtin_registry.json
# vs php_baseline.json.
#
# Rules enforced by gen_php_comparison.py:
# - status is one of: supported | partial | planned | unsupported
# - status supported/partial requires `evidence`: a repo path (file or
#   directory) or a test function name found as `fn <name>` under tests/.
# - `docs`, when present, must be an existing repo path.
# Entries render in file order.

