name: elephc-edge

# Default edge: Caddy. See compose.nginx.yml and compose.ferron.yml for the
# other edge examples, and compose.tcp.yml for the loopback-TCP variant.
#
#   docker compose -f examples/web-edge/deploy/compose.yml up --build
#
# Only the edge publishes ports. The origin listens on a Unix socket in the
# shared elephc-run volume; the final image runs the binary directly as PID 1.

services:
  init:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        mkdir -p /run/elephc /var/lib/elephc/sessions /data /config
        chown -R 10001:10001 /run/elephc /var/lib/elephc /data /config
        chmod 0770 /run/elephc
    volumes:
      - elephc-run:/run/elephc
      - elephc-sessions:/var/lib/elephc/sessions
      - caddy-data:/data
      - caddy-config:/config
    restart: "no"

  app:
    build:
      context: ../../..
      dockerfile: examples/web-edge/deploy/Dockerfile.app
    user: "10001:10001"
    environment:
      ELEPHC_SESSION_SAVE_PATH: /var/lib/elephc/sessions
    volumes:
      - elephc-run:/run/elephc
      - elephc-sessions:/var/lib/elephc/sessions
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      # The slim image has no curl/wget; the socket check proves the master
      # bound the listener. The edge performs the HTTP-level health check.
      test: ["CMD-SHELL", "test -S /run/elephc/app.sock"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  edge:
    image: caddy:2.10-alpine
    user: "10001:10001"
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - elephc-run:/run/elephc:ro
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../public:/srv/app/public:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  elephc-run:
  elephc-sessions:
  caddy-data:
  caddy-config:
