# HAProxy in front of the compiled elephc origin.
# HAProxy does not serve static files; pair it with a static server or object
# store if the application needs one. The certificate PEM must contain both the
# certificate and the private key.
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend https
    bind :80
    bind :443 ssl crt /etc/ssl/private/example.com.pem alpn h2,http/1.1
    default_backend elephc

backend elephc
    option httpchk GET /healthz
    http-check expect status 200
    server app /run/elephc/app.sock
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]
