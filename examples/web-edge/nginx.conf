# nginx reverse proxy in front of the compiled elephc origin.
# Certificates are managed outside this snippet (for example by certbot).
upstream elephc_origin {
    server unix:/run/elephc/app.sock;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /srv/app/public;

    location /static/ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://elephc_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Replace, do not append, because the origin trusts only this edge.
        # The empty Forwarded value removes the client-supplied RFC 7239 chain.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
