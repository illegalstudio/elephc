# Apache httpd reverse proxy in front of the compiled elephc origin.
# Requires mod_proxy, mod_proxy_http, mod_headers, and mod_ssl.
# Certificates are managed outside this snippet (for example by certbot).
<VirtualHost *:80>
    ServerName example.com
    Redirect permanent / https://example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/example.com/privkey.pem

    ProxyPreserveHost On
    # We set every forwarded header explicitly below; disabling mod_proxy's
    # automatic additions avoids duplicate X-Forwarded-For/Host values.
    ProxyAddHeaders Off

    # Static assets are served by Apache, not the origin.
    ProxyPass /static/ !
    Alias /static/ /srv/app/public/static/
    <Directory /srv/app/public/static>
        Require all granted
    </Directory>

    # Unix-socket upstream. Use http://127.0.0.1:8080/ for loopback TCP.
    ProxyPass / unix:/run/elephc/app.sock|http://localhost/
    ProxyPassReverse / unix:/run/elephc/app.sock|http://localhost/

    # The origin prefers Forwarded over X-Forwarded-*; remove the client chain
    # and replace every fact the origin reads.
    RequestHeader unset Forwarded
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
</VirtualHost>
