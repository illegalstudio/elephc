# Apache httpd reverse proxy in front of the compiled elephc origin.
# Requires mod_proxy, mod_proxy_http, and mod_headers. TLS certificates are
# managed outside this snippet (for example by certbot); add the usual
# SSLEngine / SSLCertificateFile directives for the :443 virtual host.
<VirtualHost *:80>
    ServerName example.com
    ProxyPreserveHost On

    # Static assets are served by Apache, not the origin.
    ProxyPass /static/ !
    Alias /static/ /srv/app/public/static/
    <Directory /srv/app/public/static>
        Require all granted
    </Directory>

    # Unix-socket upstream. Use http://127.0.0.1:8080/ for loopback TCP.
    ProxyPass / unix:/run/elephc/app.sock|http://localhost/
    ProxyPassReverse / unix:/run/elephc/app.sock|http://localhost/

    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
</VirtualHost>
