# Ferron 3 RC (PREVIEW) configuration (.conf syntax).
# Verified against Ferron 3.0.0-rc.10. Ferron 3 is still a release candidate:
# this file is a preview and must not be presented as the stable path yet.
# Do not mix this .conf syntax with the KDL syntax in ferron-2.kdl.

# The proxy stage runs before the static-file stage. Skip it for /static so the
# host-level root can serve the assets; everything else goes to the origin.
match static_path {
    request.uri.path ~ "^/static/"
}

example.com {
    tls {
        provider acme
        challenge http-01
        contact admin@example.com
    }

    root /srv/app/public

    location / {
        if_not static_path {
            proxy {
                upstream http://localhost {
                    unix /run/elephc/app.sock
                }
                # Loopback TCP alternative:
                # upstream http://127.0.0.1:8080

                # Ferron 3 sets X-Forwarded-For / X-Forwarded-Proto /
                # X-Real-IP / Forwarded automatically for proxy upstreams.
                keepalive
            }
        }
    }
}
