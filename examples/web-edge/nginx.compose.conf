# HTTP-only nginx configuration for the local compose stack.
# Production TLS belongs in nginx.conf (or an upstream TLS terminator).
upstream elephc_origin {
    server unix:/run/elephc/app.sock;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /srv/app/public;

    location /static/ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://elephc_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
