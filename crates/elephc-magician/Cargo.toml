[package]
name = "elephc-magician"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional eval bridge staticlib for elephc compiled PHP programs"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

# Off by default. `elephc-curl` needs the pinned native libcurl/OpenSSL/zlib
# archives ONLY at the final PHP-program link step (see `crates/elephc-curl/
# Cargo.toml`'s own header for why compiling it never does), so enabling this
# feature costs nothing for `cargo build`/`cargo test -p elephc-magician`
# without it. It exists so `src/linker/bridges.rs` can build a curl-aware
# `libelephc_magician.a` ONLY for a compiled program that already links
# `elephc_curl` (see `crates/elephc-magician/src/interpreter/builtins/curl/
# mod.rs` for the full rationale) — every other consumer of this crate,
# including every existing eval codegen test, keeps building the exact same
# curl-free archive this crate has always produced.
#
# The root `elephc` package also relays this feature (its own `curl`), which is
# how the workspace parity suite and the builtin-docs exporter see the eval
# bindings and the shared catalog's `curl_*` contracts in one process. Those are
# metadata readers: they never reach the eval dispatch table, so they link
# without a native libcurl too.
[features]
# Also publishes the shared catalog's PHP-visible `curl_*` contracts: the
# eval homes below bind to them by ID, and the catalog's backend-coverage
# audit requires the contract set and the binding set to move together.
curl = ["elephc-builtin-contract/curl"]

[dependencies]
elephc-builtin-contract = { path = "../elephc-builtin-contract" }
elephc-crypto = { path = "../elephc-crypto" }
elephc-phar = { path = "../elephc-phar" }
flate2 = "1"
inventory = "0.3"
libc = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
elephc-bcmath = { path = "../elephc-bcmath" }
serde_json = "1"
