[package]
name = "elephc-tokenizer-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared byte-preserving PHP tokenizer engine for elephc"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
# `TOKEN_PARSE` validation needs the shared elephc AST parser. The tokenizer
# bridge and Magician enable it; a lexer-only embedder leaves it off and links
# no parser at all.
parse = ["dep:elephc-syntax-validate"]

[dependencies]
elephc-syntax-validate = { path = "../elephc-syntax-validate", optional = true }
elephc-builtin-contract = { path = "../elephc-builtin-contract" }

[dev-dependencies]
serde_json = "1"
