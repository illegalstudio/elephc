[package]
name = "elephc-tz"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "php-src timelib and IANA timezone bridge for elephc's DateTime family"
publish = false

# Built as a C-callable staticlib (linked into compiled PHP programs that use
# DateTimeZone::getLocation/getTransitions/listAbbreviations or their procedural
# aliases) and an rlib (so the bridge is unit-testable via
# `cargo test -p elephc-tz`). Mirrors crates/elephc-crypto / elephc-tls / elephc-pdo.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]

[build-dependencies]
cc = "1"
