[package]
name = "elephc-memoir"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Shared memory-management emitters and eval ownership protocols for Elephc"

[lib]
crate-type = ["rlib"]

[features]
default = []
codegen = []
runtime = ["dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }
