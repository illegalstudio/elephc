[package]
name = "elephc-proc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "posix_spawn-backed PHP proc_open family bridge and stable C ABI for elephc"
publish = false

# Built as a C-callable staticlib (linked into compiled PHP programs whose injected
# proc prelude declares the `extern "elephc_proc"` block) and an rlib (so the spawn,
# descriptor and wait logic is unit-testable with `cargo test -p elephc-proc`).
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
elephc-process-context = { path = "../elephc-process-context" }
libc = "0.2"
