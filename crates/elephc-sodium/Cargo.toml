[package]
name = "elephc-sodium"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust ext/sodium bridge for elephc"
license = "MIT"
publish = false

# Built as a C-callable staticlib for compiled programs that use sodium_*,
# and as an rlib so the AEAD wrappers are unit-testable.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["std", "salsa20"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
keccak = "0.1.6"
scrypt = { version = "0.12.0", default-features = false, features = ["mcf"] }
ml-kem = { version = "0.3.4", features = ["getrandom"] }
x-wing = { version = "0.1.1", features = ["getrandom"] }
