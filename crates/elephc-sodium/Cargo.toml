[package]
name = "elephc-sodium"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "libsodium-backed PHP sodium extension engine and C ABI for elephc"
publish = false

# Built as a C-callable staticlib (linked into compiled PHP programs whose prelude
# declares the `extern "elephc_sodium"` block, together with the managed `libsodium`
# native package's `libsodium.a`) and an rlib (so the operation table is unit-testable).
#
# Like elephc-gmp and elephc-xml, this bridge DECLARES libsodium's `extern "C"`
# symbols without linking them: `cargo build -p elephc-sodium` only produces archives,
# so the unresolved `crypto_*`/`randombytes_*`/`sodium_*` references stay unresolved
# until the final program link. See `build.rs` for how `cargo test -p elephc-sodium`
# opts into a real link.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
