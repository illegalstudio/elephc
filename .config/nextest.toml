[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }

[profile.ci]
failure-output = "immediate-final"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 1 }
status-level = "slow"

# `cargo nextest archive` captures the test binaries + the `elephc` bin, but NOT
# the bridge staticlibs — the codegen test runner links compiled PHP programs
# against libelephc_*.a at run time (via `ld`), so nextest can't discover them.
# Include them explicitly so archived shards can run on a machine that never
# rebuilt the workspace. Built into target/debug by `cargo build $BRIDGE_CRATES`
# in the archive job before archiving. libelephc_magician_curl.a is the odd one
# out: it is NOT part of $BRIDGE_CRATES's plain `cargo build -p elephc-magician`
# output (that build has no `curl` feature enabled), so the "Build curl-aware
# magician staticlib" step in .github/workflows/ci.yml builds and copies it into
# target/debug separately, right before this archive step runs. Without it here,
# any curl-codegen-tests shard fixture that links BOTH elephc_magician (calls
# eval()) and elephc_curl has no prebuilt copy to trust and — being an archived,
# offline shard with no cargo registry cache — cannot build one on demand either
# (see tests/codegen/support/runner.rs::ensure_magician_curl_staticlib).
[[profile.ci.archive.include]]
path = "debug/libelephc_tls.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_pdo.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_crypto.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_bcmath.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_iconv.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_phar.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_tz.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_image.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_pcntl.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_xml.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_magician.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_web.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_instr.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_probe.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_curl.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_magician_curl.a"
relative-to = "target"

# The `ir_backend_parity` first-class-callable case bundles 15 legacy-vs-EIR
# parity programs (several link the PCRE staticlib), each compiled and run twice.
# It legitimately runs ~65-70s, just over the global 60s cap, so it needs a
# longer slow-timeout to avoid spurious termination on loaded runners.
[[profile.default.overrides]]
filter = 'test(parity_function_first_class_callable_dispatch)'
slow-timeout = { period = "180s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'test(parity_function_first_class_callable_dispatch)'
slow-timeout = { period = "180s", terminate-after = 1 }

# The `codegen::eval` fixtures compile, link (against the Magician staticlib), and
# run several programs per test — five in the largest — at ~7-8s per program on
# a fast Linux box and appreciably more on the shared macOS runners, where the
# eval shards run tests in parallel. Two of them have hit the 60s cap there under
# load; keep the 60s slow warning but allow three periods before termination.
[[profile.default.overrides]]
filter = 'test(/codegen::eval::/)'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(/codegen::eval::/)'
slow-timeout = { period = "60s", terminate-after = 3 }

