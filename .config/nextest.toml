# Every test gets three 60s periods: nextest marks a test SLOW at each period and kills it
# at 180s. One budget replaces the dozens of per-family overrides that used to raise single
# tests, whole binaries and both platforms from 60s to the same 180s one at a time, after
# loaded CI runners stretched compile-heavy fixtures past the minute. Only budgets above 180s
# keep an override below; the 60s period stays so the SLOW lines in the logs and the JUnit
# report still single out everything slower than a minute.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# A fixture bundle (tests/codegen/support/bundle.rs) compiles several opaque-eval programs as
# one: one catalog compile per optimizer mode instead of one per fixture, but the run itself
# still executes every case under heap diagnostics, so the single test runs longer than any of
# the fixtures it replaced. Six periods bound a hang while leaving the bundle its savings.
# Nextest takes the FIRST matching override for a setting, so a budget that must beat a
# broader filter has to stay ahead of it in this file.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(/::test_[a-z0-9_]*_bundle$/)'
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(/::test_[a-z0-9_]*_bundle$/)'
slow-timeout = { period = "60s", terminate-after = 6 }

# These BCMath probes compile dynamic-eval hosts and exceeded 60s under local load.
# Keep their assertions and use the same bounded budget as REPL eval hosts.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(bcmath) and test(eval)'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(bcmath) and test(eval)'
slow-timeout = { period = "60s", terminate-after = 4 }

# The GMP eval parity fixture compiles one opaque-eval host (the whole builtin catalog)
# and links the GMP bridge; it measured 329s on a debug macOS host.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(~codegen::gmp_eval)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(~codegen::gmp_eval)'
slow-timeout = { period = "60s", terminate-after = 10 }

# REPL integration probes compile real dynamic-eval hosts, including multiple cache variants.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(~codegen::repl)'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(~codegen::repl)'
slow-timeout = { period = "60s", terminate-after = 4 }

# Core eval GC fixtures use opaque eval and link Magician just like codegen::eval.
# Collection comparisons and heap-debug/tagged controls often compile twice.
# Multiple macOS runs have exceeded 60s in different members of this same family,
# and two members reached the three-period cap (180s) on both attempts once a
# loaded shared runner packed the shard with 31 slow tests. Give the whole named
# family six periods, not unrelated AOT/GC tests. The compiled-program watchdog
# remains 60s independently of this outer budget. This block stays ahead of the
# opaque-eval families below, which also match some of these tests with five periods.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(/^codegen::runtime_gc::[^:]+::test_core_eval_/)'
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(/^codegen::runtime_gc::[^:]+::test_core_eval_/)'
slow-timeout = { period = "60s", terminate-after = 6 }

# These opaque-eval families compile the whole builtin catalog and run under heap
# diagnostics; measured 76-196s on a local macOS host and 100-170s on loaded Linux
# shards. Give the families a bounded 300s allowance.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and (test(/^codegen::strings::mbstring_/) or test(/^codegen::runtime_gc::mbstring::/) or test(/^codegen::runtime_gc::eval_/) or test(/^codegen::runtime_gc::instanceof_operand_owners::/) or test(/^codegen::runtime_gc::nested_property_defaults::/) or test(/^codegen::io::output_handler_exceptions::/))'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and (test(/^codegen::strings::mbstring_/) or test(/^codegen::runtime_gc::mbstring::/) or test(/^codegen::runtime_gc::eval_/) or test(/^codegen::runtime_gc::instanceof_operand_owners::/) or test(/^codegen::runtime_gc::nested_property_defaults::/) or test(/^codegen::io::output_handler_exceptions::/))'
slow-timeout = { period = "60s", terminate-after = 5 }

# `retries = 1`: a test that fails once is run again on its own before the shard reports, and
# the JUnit report marks it as flaky; a real failure fails twice. The CI shards already pass
# `--retries 1 --flaky-result pass` on their command lines (ci.yml and the shard scripts under
# scripts/ci/), so the profile states the same policy for a `--profile ci` run that passes no
# flag, local or in a new job, instead of silently running those without retries.
[profile.ci]
failure-output = "immediate-final"
final-status-level = "slow"
retries = 1
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "slow"

# One JUnit report per CI run, written under nextest's store dir, which is
# `target/nextest` relative to the workspace root (`<workspace>/target/nextest/ci/junit.xml`).
# Archived runs with `--workspace-remap .` therefore write it into the checkout's
# `target/`, not into the `--extract-to` directory. The sharded jobs upload it so
# per-test wall times are available for every run instead of only the >60s "SLOW"
# lines the console status level prints.
[profile.ci.junit]
path = "junit.xml"

# `cargo nextest archive` captures the test binaries + the `elephc` bin, but NOT
# the bridge staticlibs — the codegen test runner links compiled PHP programs
# against libelephc_*.a at run time (via `ld`), so nextest can't discover them.
# Include them explicitly so archived shards can run on a machine that never
# rebuilt the workspace. Built into target/debug by `cargo build $BRIDGE_CRATES`
# in the archive job before archiving. libelephc_magician_curl.a is the odd one
# out: it is NOT part of $BRIDGE_CRATES's plain `cargo build -p elephc-magician`
# output (that build has no `curl` feature enabled), so the "Build curl-aware
# magician staticlib" step in .github/workflows/ci.yml builds and copies it into
# target/debug separately, right before this archive step runs. Without it here,
# any curl-codegen-tests shard fixture that links BOTH elephc_magician (calls
# eval()) and elephc_curl has no prebuilt copy to trust and — being an archived,
# offline shard with no cargo registry cache — cannot build one on demand either
# (see tests/codegen/support/runner.rs::ensure_magician_curl_staticlib).
[[profile.ci.archive.include]]
path = "debug/libelephc_tls.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_pdo.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_crypto.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_openssl.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_bcmath.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_gmp.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_random.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_mbstring.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_iconv.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_phar.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_tz.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_image.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_pcntl.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_fileinfo.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_xml.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_tokenizer.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_zend.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_magician.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_web.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_instr.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_probe.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_curl.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_magician_curl.a"
relative-to = "target"

# Native fingerprints include the worker environment. Preserve the verified source
# as well as built outputs so a relocated shard can materialize its exact key offline.
[[profile.ci.archive.include]]
path = "debug/elephc-oniguruma"
relative-to = "target"
depth = "infinite"
on-missing = "error"

# These environment probes compile eval-capable web hosts. The computed-name
# regression needs three separate programs, since one literal eval target would
# otherwise retain the environment for every case. It measured 282s locally with
# the loop-invariant mbstring pass, and the shared PR-tier macOS runners can be
# several times slower; twenty periods keep a real hang bounded while letting the
# first attempt finish instead of spending the job budget on retries.
[[profile.default.overrides]]
filter = 'binary(web_tests) and test(=environment::web_environment_computed_eval_retains_population)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.ci.overrides]]
filter = 'binary(web_tests) and test(=environment::web_environment_computed_eval_retains_population)'
slow-timeout = { period = "60s", terminate-after = 20 }

# PDO_OCI loads the full PDO surface and the cold optional ODPI-C archive build
# is appreciably slower on GitHub's shared runners.
[[profile.default.overrides]]
filter = 'test(pdo_oci)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'test(pdo_oci)'
slow-timeout = { period = "300s", terminate-after = 1 }

# The EIR example corpus lowers every example in-process. It now runs about 240s on a
# fast host and crossed the 180s budget on a Linux x86_64 shard; a bounded 300s period
# keeps a real hang detectable without dropping the corpus from the suite. Reserve the
# nextest pool as well, so other tests cannot compete during this check.
[[profile.default.overrides]]
filter = 'test(lowers_examples_corpus)'
threads-required = "num-test-threads"
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'test(lowers_examples_corpus)'
threads-required = "num-test-threads"
slow-timeout = { period = "300s", terminate-after = 1 }

# `method_receiver_roots_respect_later_eval_on_all_targets` lowers and eval-checks the
# same program for every supported target. It reached 161s and timed out twice on a loaded
# Linux x86_64 non-codegen shard, so give it the all-targets budget.
[[profile.default.overrides]]
filter = 'test(method_receiver_roots_respect_later_eval_on_all_targets)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'test(method_receiver_roots_respect_later_eval_on_all_targets)'
slow-timeout = { period = "300s", terminate-after = 1 }

# This debug-range check lowers and emits the same program for all five supported targets.
# It reached 165s and timed out at the 180s budget on a loaded Linux x86_64 shard.
[[profile.default.overrides]]
filter = 'test(native_debug_ranges_stay_in_their_function_sections_on_all_targets)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'test(native_debug_ranges_stay_in_their_function_sections_on_all_targets)'
slow-timeout = { period = "300s", terminate-after = 1 }

# The profile-differential corpus compiles and runs each case once per maintained
# `--php-version`, so one test is four complete compile-link-run cycles. Most cases stay
# around 10s, but the `eval_*` ones link the 65MB Magician archive four times and measure
# 46-77s on an unloaded macOS host — already past the 60s guard before CI's slower
# containerized runners are involved. The budget is larger than the 180s default because
# the cost here is dominated by linking a large archive rather than by compilation, which
# is exactly what a loaded runner stretches most.
[[profile.default.overrides]]
filter = 'binary(php_profile_independence_tests) and test(/^eval_/)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'binary(php_profile_independence_tests) and test(/^eval_/)'
slow-timeout = { period = "300s", terminate-after = 1 }
