[test-groups.simplexml-large-bundles]
max-threads = 1

# Every test gets three 60s periods: nextest marks a test SLOW at each period and kills it
# at 180s. One budget replaces the dozens of per-family overrides that used to raise single
# tests, whole binaries and both platforms from 60s to the same 180s one at a time, after
# loaded CI runners stretched compile-heavy fixtures past the minute. Only budgets above 180s
# keep an override below; the 60s period stays so the SLOW lines in the logs and the JUnit
# report still single out everything slower than a minute.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Each PHP 8.5.8 SimpleXML PHPT fixture compiles the complete XML/SimpleXML prelude and links
# the managed libxml2 bridge. Keep the corpus at five slow-timeout periods; this copy is first
# so nextest's first-match override policy sees it before the broad macOS codegen override.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(~simplexml_php_src)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(~simplexml_php_src)'
slow-timeout = { period = "60s", terminate-after = 5 }

# ARM shard 11 lost its runner while these four catalog-sized XML bundles ran together.
# Serialize only their scheduling, preserving their assertions and existing bundle budget.
[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and (test(=codegen::runtime_gc::property_dimension_fetch_modes::test_property_dimension_xml_fetch_modes_bundle) or test(=codegen::runtime_gc::property_magic_dimension_guards::test_magic_property_dimension_xml_guards_bundle) or test(=codegen::simplexml::debug::test_simplexml_native_debug_projection_bundle) or test(=codegen::simplexml::dimension_owners::test_simplexml_dimension_write_owners_isolated_bundle))'
test-group = 'simplexml-large-bundles'

# These two single-compile XML catalog probes each reached 360s twice while
# sharing a macOS shard. Reserve the existing pool without changing their cases
# or timeout, and use CI fixture phase records to distinguish assembly from run.
[[profile.ci.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'binary(codegen_tests) and (test(=codegen::simplexml::comparisons_and_files::test_simplexml_native_comparison_and_default_namespace_bundle) or test(=codegen::simplexml::dimension_updates::test_simplexml_saved_empty_dimension_write_bundle))'
threads-required = "num-test-threads"

# The 200,000-node projection completed AOT but exceeded the unchanged 60s runtime
# limit in eval while sharing its ARM64 shard. Preserve both modes and reserve the pool.
# The indexed-incdec eval probe also reached its 360s deadline twice in x86_64
# assembly after 211s of EIR work and 131s of codegen. Keep its source and deadline.
[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and (test(=codegen::simplexml::projections::test_simplexml_large_repeated_projection_bundle) or test(=codegen::simplexml::dimension_updates::test_simplexml_computed_indexed_incdec_eval_bundle))'
threads-required = "num-test-threads"

# This AOT/eval GMP/XML pair reached its 360s deadline twice during x86_64
# linking under shared workers. Keep both programs and reserve the existing pool.
[[profile.ci.overrides]]
platform = 'cfg(target_arch = "x86_64")'
filter = 'binary(codegen_tests) and test(=codegen::simplexml::native_operators::test_simplexml_gmp_mixed_operator_dispatch_bundle)'
threads-required = "num-test-threads"

# These target probes hit 60s twice under concurrent x86_64 CI work. Preserve their
# assertions and deadlines while reserving the pool for each catalog-sized probe.
[[profile.ci.overrides]]
platform = 'cfg(target_arch = "x86_64")'
filter = 'test(/^ir_lower::tests::instance_dimension_incdec::instance_dimension_incdec_values::/) or test(/^ir_lower::tests::property_element_unset::property_element_unset_known_name_bounds_slot_dispatch::/)'
threads-required = "num-test-threads"

# These five-target native reference probes pass in 125-154s but reached their
# 180s deadline while sharing x86_64 workers; repeated attempts then exhausted
# the 30-minute shard. Reserve the pool, preserving every target and deadline.
[[profile.ci.overrides]]
platform = 'cfg(target_arch = "x86_64")'
filter = 'test(=ir_lower::tests::eval_native_reference_layout::dynamic_eval_unset_keeps_numeric_alias_payloads_in_the_sync_inventory_on_every_target) or test(=ir_lower::tests::eval_native_reference_layout::dynamic_eval_object_aliases_guard_tags_and_classes_on_every_target) or test(=codegen::eval_property_helpers::reference_getter::tests::hidden_mixed_reference_cells_keep_physical_ownership_on_every_target)'
threads-required = "num-test-threads"

# This five-target SimpleXML native-reference probe compiles the complete AST prelude for
# every target and reached its 180s deadline while sharing a linux-x86_64 shard. Reserve
# the pool so the existing target coverage and deadline stay unchanged.
[[profile.ci.overrides]]
filter = 'test(=ir_lower::tests::simplexml_targets::native_nullable_object_reference_returns_preserve_the_named_cell_on_every_target)'
threads-required = "num-test-threads"

# Phase records show these XML probes reached assembly or linking under shared work.
# The factory pair reached its unchanged 360s limit in assembly. Keep every case and budget.
[[profile.ci.overrides]]
filter = 'test(=codegen::simplexml::receiver_handoff::test_simplexml_eval_subclass_constructorless_factories) or test(=codegen::simplexml::receiver_handoff::test_simplexml_eval_subclass_factories_after_eval_returns) or test(=codegen::runtime_gc::native_raw_property_guards::test_native_dom_exception_accessors_from_eval) or test(=codegen::simplexml::factory_owners::test_simplexml_constructorless_factory_owners_bundle)'
threads-required = "num-test-threads"

# A fixture bundle (tests/codegen/support/bundle.rs) compiles several opaque-eval programs as
# one: one catalog compile per optimizer mode instead of one per fixture, but the run itself
# still executes every case under heap diagnostics, so the single test runs longer than any of
# the fixtures it replaced. Six periods bound a hang while leaving the bundle its savings.
# Nextest takes the FIRST matching override for a setting, so a budget that must beat a
# broader filter has to stay ahead of it in this file.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(/::test_[a-z0-9_]*_bundle$/)'
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(/::test_[a-z0-9_]*_bundle$/)'
slow-timeout = { period = "60s", terminate-after = 6 }

# These BCMath probes compile dynamic-eval hosts and exceeded 60s under local load.
# Keep their assertions and use the same bounded budget as REPL eval hosts.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(bcmath) and test(eval)'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(bcmath) and test(eval)'
slow-timeout = { period = "60s", terminate-after = 4 }

# The ignored GMP PHPT entry runs all 98 upstream cases sequentially. It took
# 214s under cargo test before archive migration, so the ordinary 180s single-case
# budget cannot cover it. Keep its corpus intact with a bounded ten-minute budget.
[[profile.default.overrides]]
filter = 'binary(=codegen_tests) and test(=codegen::gmp_phpt::test_gmp_php_src_phpt_corpus)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'binary(=codegen_tests) and test(=codegen::gmp_phpt::test_gmp_php_src_phpt_corpus)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The GMP eval parity fixture compiles one opaque-eval host (the whole builtin catalog)
# and links the GMP bridge; it measured 329s on a debug macOS host.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(~codegen::gmp_eval)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(~codegen::gmp_eval)'
slow-timeout = { period = "60s", terminate-after = 10 }

# REPL integration probes compile real dynamic-eval hosts, including multiple cache variants.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(~codegen::repl)'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(~codegen::repl)'
slow-timeout = { period = "60s", terminate-after = 4 }

# Core eval GC fixtures use opaque eval and link Magician just like codegen::eval.
# Collection comparisons and heap-debug/tagged controls often compile twice.
# Multiple macOS runs have exceeded 60s in different members of this same family,
# and two members reached the three-period cap (180s) on both attempts once a
# loaded shared runner packed the shard with 31 slow tests. Give the whole named
# family six periods, not unrelated AOT/GC tests. The compiled-program watchdog
# remains 60s independently of this outer budget. This block stays ahead of the
# opaque-eval families below, which also match some of these tests with five periods.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and test(/^codegen::runtime_gc::[^:]+::test_core_eval_/)'
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and test(/^codegen::runtime_gc::[^:]+::test_core_eval_/)'
slow-timeout = { period = "60s", terminate-after = 6 }

# These opaque-eval families compile the whole builtin catalog and run under heap
# diagnostics; measured 76-196s on a local macOS host and 100-170s on loaded Linux
# shards. Give the families a bounded 300s allowance.
# Native XML factory/accessor eval probes compile the same catalog. The constructorless
# factory probe generated 249 MB of assembly and reached 180s before linking finished.
# Include that workload here rather than giving each probe a separate timeout override.
[[profile.default.overrides]]
filter = 'binary(codegen_tests) and (test(/^codegen::strings::mbstring_/) or test(/^codegen::runtime_gc::mbstring::/) or test(/^codegen::runtime_gc::eval_/) or test(/^codegen::runtime_gc::instanceof_operand_owners::/) or test(/^codegen::runtime_gc::nested_property_defaults::/) or test(/^codegen::io::output_handler_exceptions::/) or test(/^codegen::simplexml::receiver_handoff::test_simplexml_eval_subclass_/) or test(=codegen::runtime_gc::native_raw_property_guards::test_native_dom_exception_accessors_from_eval))'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'binary(codegen_tests) and (test(/^codegen::strings::mbstring_/) or test(/^codegen::runtime_gc::mbstring::/) or test(/^codegen::runtime_gc::eval_/) or test(/^codegen::runtime_gc::instanceof_operand_owners::/) or test(/^codegen::runtime_gc::nested_property_defaults::/) or test(/^codegen::io::output_handler_exceptions::/) or test(/^codegen::simplexml::receiver_handoff::test_simplexml_eval_subclass_/) or test(=codegen::runtime_gc::native_raw_property_guards::test_native_dom_exception_accessors_from_eval))'
slow-timeout = { period = "60s", terminate-after = 5 }

# `retries = 1`: a test that fails once is run again on its own before the shard reports, and
# the JUnit report marks it as flaky; a real failure fails twice. The CI shards already pass
# `--retries 1 --flaky-result pass` on their command lines (ci.yml and the shard scripts under
# scripts/ci/), so the profile states the same policy for a `--profile ci` run that passes no
# flag, local or in a new job, instead of silently running those without retries.
[profile.ci]
failure-output = "immediate-final"
final-status-level = "slow"
retries = 1
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "slow"

# One JUnit report per CI run, written under nextest's store dir, which is
# `target/nextest` relative to the workspace root (`<workspace>/target/nextest/ci/junit.xml`).
# Archived runs with `--workspace-remap .` therefore write it into the checkout's
# `target/`, not into the `--extract-to` directory. The sharded jobs upload it so
# per-test wall times are available for every run instead of only the >60s "SLOW"
# lines the console status level prints.
[profile.ci.junit]
path = "junit.xml"

# `cargo nextest archive` captures the test binaries + the `elephc` bin, but NOT
# the bridge staticlibs — the codegen test runner links compiled PHP programs
# against libelephc_*.a at run time (via `ld`), so nextest can't discover them.
# Include them explicitly so archived shards can run on a machine that never
# rebuilt the workspace. Built into target/debug by `cargo build $BRIDGE_CRATES`
# in the archive job before archiving. libelephc_magician_curl.a is the odd one
# out: it is NOT part of $BRIDGE_CRATES's plain `cargo build -p elephc-magician`
# output (that build has no `curl` feature enabled), so the "Build curl-aware
# magician staticlib" step in .github/workflows/ci.yml builds and copies it into
# target/debug separately, right before this archive step runs. Without it here,
# any curl-codegen-tests shard fixture that links BOTH elephc_magician (calls
# eval()) and elephc_curl has no prebuilt copy to trust and — being an archived,
# offline shard with no cargo registry cache — cannot build one on demand either
# (see tests/codegen/support/runner.rs::ensure_magician_curl_staticlib).
[[profile.ci.archive.include]]
path = "debug/libelephc_tls.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_pdo.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_crypto.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_openssl.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_bcmath.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_gmp.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_random.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_mbstring.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_iconv.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_phar.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_tz.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_image.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_pcntl.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_fileinfo.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_xml.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_tokenizer.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_zend.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_magician.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_reference.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_web.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_instr.a"
relative-to = "target"
[[profile.ci.archive.include]]
path = "debug/libelephc_probe.a"
