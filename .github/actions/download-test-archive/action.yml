name: Download test archive
description: >
  Downloads artifacts with bounded retries and validates complete nextest zstd frames
  before a test shard can extract them.

# Short-lived shards were dying in 11-14 seconds with
# `Unable to download artifact(s): ListArtifacts ... 403 Forbidden`, before running a single
# test, while sibling shards of the same matrix passed (issue #939). That is the artifact API
# refusing one request, not a product regression, and the run it kills has already spent a full
# build on the archive it was about to use.
#
# A successful download can also leave a truncated inner nextest archive (PR #2208).
# Check the complete zstd frame before accepting it, so that failure participates in the
# same three attempts. Native-cache artifacts use this action too and retain download-only
# validation. The final download and validation fail normally if recovery is exhausted.
#
# A slowly progressing transfer can outlive the downloader's idle timeout and exhaust the
# whole job before a retry. Composite steps do not support timeout-minutes, so preload a
# process deadline only for each downloader. Node actions start in the mapped workspace;
# a relative preload works both on the host and inside Linux job containers.

inputs:
  name:
    description: Artifact name to download
    required: true
  path:
    description: Directory to extract the artifact into
    required: true

  allow-builds:
    description: Producer restoring dependencies before compiling its own variant
    default: 'false'
  validate-payload:
    description: Check a generic build payload checksum before accepting a download
    default: 'false'
  token:
    description: Artifact reader token
    default: ${{ github.token }}
  run-id:
    description: Explicit producing workflow run
    default: ${{ github.run_id }}
  attempt:
    description: Build attempt for nextest payloads
    default: ${{ github.run_attempt }}
  defer-transfer-failure:
    description: Return a recoverable status only for a shard with a mandatory recovery verdict
    default: 'false'

outputs:
  status:
    description: downloaded or retryable-transfer; integrity and unknown failures still fail the action
    value: ${{ steps.classify.outputs.status }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/forbid-consumer-builds
      if: inputs.allow-builds != 'true'
    - id: first
      uses: actions/download-artifact@v8.0.2
      continue-on-error: true
      env:
        NODE_OPTIONS: --require ./.github/actions/download-test-archive/deadline.cjs
      with:
        name: ${{ startsWith(inputs.name, 'nextest-archive-') && format('{0}-{1}', inputs.name, inputs.attempt) || inputs.name }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        digest-mismatch: error

    - id: first_archive
      if: steps.first.outcome == 'success' && (startsWith(inputs.name, 'nextest-archive-') || inputs.validate-payload == 'true')
      continue-on-error: true
      shell: bash
      env:
        ARCHIVE_DIR: ${{ steps.first.outputs.download-path }}
        VALIDATE_PAYLOAD: ${{ inputs.validate-payload }}
      # Runtime paths are already mapped into a job container; contexts can retain host paths.
      run: bash "$GITHUB_ACTION_PATH/validate.sh" "$ARCHIVE_DIR"

    - if: steps.first.outcome == 'failure' || steps.first_archive.outcome == 'failure'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        ARCHIVE_DIR: ${{ steps.first.outputs.download-path }}
        VALIDATE_PAYLOAD: ${{ inputs.validate-payload }}
      run: |
        echo "::warning title=Artifact download retried::$ARTIFACT_NAME failed download or archive validation; retrying in 15s"
        if [[ "$ARTIFACT_NAME" == nextest-archive-* && -n "$ARCHIVE_DIR" ]]; then
          rm -f -- "$ARCHIVE_DIR/nextest-archive.tar.zst"
        fi
        if [[ "$VALIDATE_PAYLOAD" == true && -n "$ARCHIVE_DIR" ]]; then
          rm -f -- "$ARCHIVE_DIR/payload.tar.gz" "$ARCHIVE_DIR/manifest.json"
        fi
        sleep 15

    - id: second
      if: steps.first.outcome == 'failure' || steps.first_archive.outcome == 'failure'
      uses: actions/download-artifact@v8.0.2
      continue-on-error: true
      env:
        NODE_OPTIONS: --require ./.github/actions/download-test-archive/deadline.cjs
      with:
        name: ${{ startsWith(inputs.name, 'nextest-archive-') && format('{0}-{1}', inputs.name, inputs.attempt) || inputs.name }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        digest-mismatch: error

    - id: second_archive
      if: steps.second.outcome == 'success' && (startsWith(inputs.name, 'nextest-archive-') || inputs.validate-payload == 'true')
      continue-on-error: true
      shell: bash
      env:
        ARCHIVE_DIR: ${{ steps.second.outputs.download-path }}
        VALIDATE_PAYLOAD: ${{ inputs.validate-payload }}
      run: bash "$GITHUB_ACTION_PATH/validate.sh" "$ARCHIVE_DIR"

    - if: steps.second.outcome == 'failure' || steps.second_archive.outcome == 'failure'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        ARCHIVE_DIR: ${{ steps.second.outputs.download-path }}
        VALIDATE_PAYLOAD: ${{ inputs.validate-payload }}
      run: |
        echo "::warning title=Artifact download retried::$ARTIFACT_NAME failed twice; retrying in 45s"
        if [[ "$ARTIFACT_NAME" == nextest-archive-* && -n "$ARCHIVE_DIR" ]]; then
          rm -f -- "$ARCHIVE_DIR/nextest-archive.tar.zst"
        fi
        if [[ "$VALIDATE_PAYLOAD" == true && -n "$ARCHIVE_DIR" ]]; then
          rm -f -- "$ARCHIVE_DIR/payload.tar.gz" "$ARCHIVE_DIR/manifest.json"
        fi
        sleep 45

    - id: third
      if: steps.second.outcome == 'failure' || steps.second_archive.outcome == 'failure'
      uses: actions/download-artifact@v8.0.2
      continue-on-error: true
      env:
        NODE_OPTIONS: --require ./.github/actions/download-test-archive/deadline.cjs
      with:
        name: ${{ startsWith(inputs.name, 'nextest-archive-') && format('{0}-{1}', inputs.name, inputs.attempt) || inputs.name }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        digest-mismatch: error

    - id: third_archive
      if: steps.third.outcome == 'success' && (startsWith(inputs.name, 'nextest-archive-') || inputs.validate-payload == 'true')
      continue-on-error: true
      shell: bash
      env:
        ARCHIVE_DIR: ${{ steps.third.outputs.download-path }}
        VALIDATE_PAYLOAD: ${{ inputs.validate-payload }}
      run: bash "$GITHUB_ACTION_PATH/validate.sh" "$ARCHIVE_DIR"

    - id: classify
      shell: bash
      env:
        DOWNLOAD_OUTCOMES: ${{ toJSON(fromJSON(format('["{0}","{1}","{2}"]', steps.first.outcome, steps.second.outcome, steps.third.outcome))) }}
        VALIDATION_OUTCOMES: ${{ toJSON(fromJSON(format('["{0}","{1}","{2}"]', steps.first_archive.outcome, steps.second_archive.outcome, steps.third_archive.outcome))) }}
        TRANSFER_FLAGS: ${{ toJSON(fromJSON(format('["{0}","{1}","{2}"]', steps.first.outputs.retryable-transfer, steps.second.outputs.retryable-transfer, steps.third.outputs.retryable-transfer))) }}
        DEFER_TRANSFER_FAILURE: ${{ inputs.defer-transfer-failure }}
      run: python3 -B scripts/ci/artifact_download_outcome.py

    - name: Validate nextest source and producer
      if: steps.classify.outputs.status == 'downloaded' && startsWith(inputs.name, 'nextest-archive-')
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        ARTIFACT_RUN: ${{ inputs.run-id }}
        ARTIFACT_ATTEMPT: ${{ inputs.attempt }}
        ARCHIVE_DIR: ${{ steps.third.outputs.download-path || steps.second.outputs.download-path || steps.first.outputs.download-path }}
      run: |
        target=${ARTIFACT_NAME#nextest-archive-}
        variant=workspace
        if [[ "$target" == codegen-* ]]; then target=${target#codegen-}; variant=codegen; fi
        python3 -B scripts/ci/test_archive_manifest.py verify "$ARCHIVE_DIR" \
          --target "$target" --variant "$variant" --run-id "$ARTIFACT_RUN" --attempt "$ARTIFACT_ATTEMPT"
        sh scripts/ci/validate_archived_nextest.sh "$ARCHIVE_DIR"

    - uses: ./.github/actions/pin-test-bridges
      if: steps.classify.outputs.status == 'downloaded' && startsWith(inputs.name, 'nextest-archive-')

    - name: Explain recovery after completed-run cleanup
      if: failure() && steps.third.outcome == 'failure'
      shell: bash
      run: echo '::error::Completed runs discard intermediate artifacts. If this is a rerun of a concluded workflow, use Re-run all jobs to regenerate its inputs.'
