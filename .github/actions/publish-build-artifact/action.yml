name: Publish build artifact
description: Package immutable compiler outputs with configuration and file checksums.
inputs:
  target:
    description: Elephc host or library target
    required: true
  kind:
    description: Artifact payload kind
    required: true
  profile:
    description: Cargo output profile
    default: debug
  features:
    description: Exact comma-separated Cargo features
    default: ''
  sha:
    description: Source commit checked out by the producer
    default: ${{ github.sha }}
outputs:
  attempt:
    description: Producing attempt, including when only consumers are rerun
    value: ${{ github.run_attempt }}
  artifact-id:
    description: Immutable uploaded artifact ID
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Package outputs
      shell: bash
      env:
        ARTIFACT_TARGET: ${{ inputs.target }}
        ARTIFACT_KIND: ${{ inputs.kind }}
        ARTIFACT_PROFILE: ${{ inputs.profile }}
        ARTIFACT_FEATURES: ${{ inputs.features }}
        ARTIFACT_SHA: ${{ inputs.sha }}
      run: |
        python3 -B scripts/ci/build_artifacts.py create \
          --artifact "$RUNNER_TEMP/build-$ARTIFACT_TARGET-$ARTIFACT_PROFILE-$ARTIFACT_KIND" \
          --sha "$ARTIFACT_SHA" --target "$ARTIFACT_TARGET" \
          --profile "$ARTIFACT_PROFILE" --features "$ARTIFACT_FEATURES" --kind "$ARTIFACT_KIND"
    - name: Upload outputs
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ inputs.target }}-${{ inputs.profile }}-${{ inputs.kind }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build-${{ inputs.target }}-${{ inputs.profile }}-${{ inputs.kind }}/
        compression-level: 0
        if-no-files-found: error
        retention-days: 3
