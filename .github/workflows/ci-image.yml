name: CI Image

# Candidate dispatches publish only source-addressed tags. Consumers switch
# after content checks on every architecture, without replacing live images.
on:
  push:
    branches: [main]
    paths:
      - '.github/docker/ci.Dockerfile'
      - 'scripts/ci/apt_install.sh'
      - 'scripts/ci/install_pdo_clients.sh'
      - 'scripts/ci/verify_image.sh'
      - 'scripts/ci/verify_libclang.py'
      - 'scripts/phpext/build_host.py'
      - 'examples/testing/composer.json'
      - '.github/workflows/ci-image.yml'
  pull_request:
    paths:
      - '.github/docker/ci.Dockerfile'
      - 'scripts/ci/apt_install.sh'
      - 'scripts/ci/install_pdo_clients.sh'
      - 'scripts/ci/verify_image.sh'
      - 'scripts/ci/verify_libclang.py'
      - 'scripts/phpext/build_host.py'
      - 'examples/testing/composer.json'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

concurrency:
  group: ci-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}-ci

jobs:
  build:
    name: Build image (${{ matrix.role }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: ci
            target: ci
            ubuntu: '24.04'
            zts: '0'
            arch: amd64
            runner: ubuntu-24.04
          - role: ci
            target: ci
            ubuntu: '24.04'
            zts: '0'
            arch: arm64
            runner: ubuntu-24.04-arm
          - role: smoke
            target: smoke
            ubuntu: '24.04'
            zts: '0'
            arch: amd64
            runner: ubuntu-24.04
          - role: smoke
            target: smoke
            ubuntu: '24.04'
            zts: '0'
            arch: arm64
            runner: ubuntu-24.04-arm
          - role: smoke22
            target: smoke
            ubuntu: '22.04'
            zts: '0'
            arch: amd64
            runner: ubuntu-24.04
          - role: smoke22
            target: smoke
            ubuntu: '22.04'
            zts: '0'
            arch: arm64
            runner: ubuntu-24.04-arm
          - role: php-nts
            target: php
            ubuntu: '24.04'
            zts: '0'
            arch: amd64
            runner: ubuntu-24.04
          - role: php-nts
            target: php
            ubuntu: '24.04'
            zts: '0'
            arch: arm64
            runner: ubuntu-24.04-arm
          - role: php-ts
            target: php
            ubuntu: '24.04'
            zts: '1'
            arch: amd64
            runner: ubuntu-24.04
          - role: php-ts
            target: php
            ubuntu: '24.04'
            zts: '1'
            arch: arm64
            runner: ubuntu-24.04-arm
          - role: pdo
            target: pdo
            ubuntu: '24.04'
            zts: '0'
            arch: amd64
            runner: ubuntu-24.04
          - role: kdc
            target: kdc
            ubuntu: '24.04'
            zts: '0'
            arch: amd64
            runner: ubuntu-24.04
          - role: reference84
            target: reference
            ubuntu: '24.04'
            zts: '0'
            arch: amd64
            runner: ubuntu-24.04
          - role: reference85
            target: reference
            ubuntu: '24.04'
            zts: '0'
            arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3, 2025-12-16

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v3, 2026-01-27
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6, 2026-02-12
        with:
          context: .
          file: .github/docker/ci.Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            PHP_ZTS=${{ matrix.zts }}
            PHP_VERSION=${{ matrix.role == 'reference84' && '8.4.27' || '8.5.11' }}
          load: true
          tags: ${{ env.IMAGE }}:build-${{ github.run_id }}-${{ matrix.role }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.role }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.role }}-${{ matrix.arch }}
      - name: Verify installed tools and isolation
        env:
          ROLE: ${{ matrix.role }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --network none \
            --volume "$PWD/scripts/ci/verify_image.sh:/verify-image:ro" \
            "${IMAGE}:build-${GITHUB_RUN_ID}-${ROLE}-${ARCH}" bash /verify-image "$ROLE"
      - name: Publish verified candidate
        if: github.event_name != 'pull_request'
        env:
          ROLE: ${{ matrix.role }}
          ARCH: ${{ matrix.arch }}
        run: docker push "${IMAGE}:build-${GITHUB_RUN_ID}-${ROLE}-${ARCH}"

  manifest:
    name: Publish manifest (${{ matrix.role }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        role: [ci, smoke, smoke22, php-nts, php-ts, pdo, kdc, reference84, reference85]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v3, 2026-01-27
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish source-addressed manifest
        env:
          ROLE: ${{ matrix.role }}
        run: |
          images=("${IMAGE}:build-${GITHUB_RUN_ID}-${ROLE}-amd64")
          if [[ "$ROLE" != pdo && "$ROLE" != kdc && "$ROLE" != reference* ]]; then
            images+=("${IMAGE}:build-${GITHUB_RUN_ID}-${ROLE}-arm64")
          fi
          docker buildx imagetools create --tag "${IMAGE}:sha-${GITHUB_SHA}-${ROLE}" "${images[@]}"
          # Only the default branch can activate the shared producer image.
          if [[ "$GITHUB_REF" == refs/heads/main && "$ROLE" == ci ]]; then
            docker buildx imagetools create --tag "${IMAGE}:latest" --tag "${IMAGE}:sha-${GITHUB_SHA::7}" "${images[@]}"
          fi
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}-${ROLE}"
