        # cannot build this themselves on demand.
        run: |
          cargo build -p elephc-magician --features curl \
            --target-dir target/elephc-magician-curl-test-build
          cp target/elephc-magician-curl-test-build/debug/libelephc_magician.a \
            target/debug/libelephc_magician_curl.a

      - name: Ensure Python for Oniguruma bundle preparation
        shell: bash
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
          fi
          python3 --version

      - name: Publish the shared compiler
        id: publish-compiler
        uses: ./.github/actions/publish-build-artifact
        with:
          target: linux-x86_64
          kind: compiler

      - name: Publish the shared bridges
        uses: ./.github/actions/publish-build-artifact
        with:
          target: linux-x86_64
          kind: bridges

      - name: Prepare offline Oniguruma test bundle
        run: python3 scripts/ci/prepare_oniguruma_tests.py target/debug/elephc target/debug/elephc-oniguruma --target linux-x86_64

      - name: Archive test binaries
        # Two archives from one build; see the macOS job for why.
        run: |
          cargo nextest archive --profile ci --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
          cp "$(command -v cargo-nextest)" "$RUNNER_TEMP/cargo-nextest"
          (cd "$RUNNER_TEMP" && sha256sum cargo-nextest > cargo-nextest.sha256)
          mkdir -p "$RUNNER_TEMP/codegen-archive"
          cargo nextest archive --profile ci -p elephc --test codegen_tests \
            --archive-file "$RUNNER_TEMP/codegen-archive/nextest-archive.tar.zst"

      - name: Run doctests
        # Doctests cannot run from a nextest archive, so run them here where the
        # workspace is already built.
        run: cargo test --workspace --doc

