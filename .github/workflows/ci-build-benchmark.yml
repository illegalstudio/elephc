name: Build benchmark compiler

on:
  workflow_call:
    outputs:
      artifact-attempt:
        value: ${{ jobs.build.outputs.artifact-attempt }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      artifact-attempt: ${{ steps.build.outputs.artifact-attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, 2026-08-06
        with:
          prefix-key: rust-deps-benchmark-release
          cache-bin: false
      - id: build
        uses: ./.github/actions/build-release-artifacts
        with:
          target: aarch64-apple-darwin
          sha: ${{ github.sha }}
