name: Release

on:
  # Use create instead of push tags so commit-message skip directives do not
  # suppress the release gate before it can verify the tagged commit.
  create:

# Least privilege by default. `permissions:` at the workflow level applies to
# EVERY job, so declaring `contents: write` here handed a write token to the
# build jobs, which run third-party actions and never write anything — a moved
# or compromised upstream ref would have run with authority over this
# repository's contents, releases and tags. Only the jobs that publish are
# granted write below.
permissions:
  contents: read

jobs:
  verify-ci:
    name: Verify CI for tagged commit
    # Reads the `Build & Test` check run on the tagged commit.
    permissions:
      contents: read
      checks: read
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve tagged commit
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          SHA="$(git rev-list -n 1 "$GITHUB_REF")"
          echo "name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Require tag on main
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to ${SHA}, which is not reachable from origin/main."
            exit 1
          fi

      - name: Require green Build & Test check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          RESULT="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=Build%20%26%20Test&status=completed&filter=latest" \
            --jq '.check_runs | map(select(.app.slug == "github-actions" and .conclusion == "success")) | first // {} | [(.conclusion // ""), (.html_url // "")] | @tsv')"
          CONCLUSION="$(printf '%s' "$RESULT" | cut -f1)"
          CHECK_URL="$(printf '%s' "$RESULT" | cut -f2)"

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Tagged commit ${SHA} does not have a successful Build & Test check."
            exit 1
          fi

          echo "Found successful Build & Test check: ${CHECK_URL}"

  prepare:
    name: Bump version on main
    # Pushes the version-bump commit to main.
    permissions:
      contents: write
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    needs:
      - verify-ci
    outputs:
      # The bump commit every build job checks out, so all three targets build
      # the same patched tree without re-applying (or racing to push) the
      # version bump themselves.
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set version from tag and push bump to main
        id: bump
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["VERSION"]

          cargo_toml = Path("Cargo.toml")
          cargo_toml.write_text(
              re.sub(
                  r'^version = ".*"$',
                  f'version = "{version}"',
                  cargo_toml.read_text(),
                  count=1,
                  flags=re.MULTILINE,
              )
          )

          cargo_lock = Path("Cargo.lock")
          cargo_lock.write_text(
              re.sub(
                  r'(\[\[package\]\]\nname = "elephc"\nversion = ")[^"]+(")',
                  rf'\g<1>{version}\2',
                  cargo_lock.read_text(),
                  count=1,
              )
          )
          PY
          echo "Set Cargo.toml and Cargo.lock version to ${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${VERSION}" || true
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ${{ matrix.runner }}
    needs:
      - verify-ci
      - prepare
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14  # Apple Silicon runner
          # Linux release builds run on ubuntu-22.04 (glibc 2.35) rather than
          # the ubuntu-24.04 generation CI tests on, so the published binaries
          # also run on older distros (Ubuntu 22.04, Debian 12, RHEL 9, ...).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Verify release binary version
        run: |
          EXPECTED="elephc ${GITHUB_REF_NAME#v}"
          ACTUAL="$(target/release/elephc --version)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release version mismatch: expected '${EXPECTED}', got '${ACTUAL}'."
            exit 1
          fi
          echo "Verified release binary version: ${ACTUAL}"

      # Every bridge in `BRIDGES` (src/linker/bridges.rs), in that order. A bridge
      # missing here ships a compiler that refuses the flag it advertises;
      # `every_bridge_staticlib_ships_in_the_release_tarball` fails the build
      # rather than letting the two lists drift again.
      - name: Build release bridge staticlibs
        run: cargo build --release -p elephc-tls -p elephc-pdo -p elephc-crypto -p elephc-bcmath -p elephc-iconv -p elephc-phar -p elephc-tz -p elephc-image -p elephc-probe -p elephc-instr -p elephc-web -p elephc-pcntl -p elephc-magician -p elephc-curl

      - name: Build curl-aware Magician staticlib
        run: |
          cargo build --release -p elephc-magician --features curl \
            --target-dir target/elephc-magician-curl-release-build
          cp target/elephc-magician-curl-release-build/release/libelephc_magician.a \
            target/release/libelephc_magician_curl.a

      - name: Strip binary
        run: strip target/release/elephc

      - name: Create tarball
        run: |
          cd target/release
          TARBALL="elephc-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar czf "$TARBALL" \
            elephc \
            libelephc_tls.a \
            libelephc_pdo.a \
            libelephc_crypto.a \
            libelephc_bcmath.a \
            libelephc_iconv.a \
            libelephc_phar.a \
            libelephc_tz.a \
            libelephc_image.a \
            libelephc_probe.a \
            libelephc_instr.a \
            libelephc_web.a \
            libelephc_pcntl.a \
            libelephc_magician.a \
            libelephc_curl.a \
            libelephc_magician_curl.a
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$TARBALL" > "$TARBALL.sha256"
          else
            shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            target/release/elephc-*.tar.gz
            target/release/elephc-*.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

  # Compile against the tarball that is about to be published, on the platform
  # it targets. A bridge archive is resolved from the directory the binary lives
  # in (or its sibling `lib/`), so a compiler ships with exactly what was packed
  # beside it and will still advertise a capability whose archive nobody packed
  # — which is how every tarball from v0.26.3 to v0.26.5 shipped without
  # `libelephc_magician.a`, refusing `--with-eval` and any `eval()` the compiler
  # could not fold. No test that runs in a checkout can see that, because
  # `target/` always holds every archive.
  #
  # The probe reads its list from `elephc --print-capabilities` inside the
  # tarball, so it needs no packing list of its own to be kept in step.
  verify-artifact:
    name: Verify ${{ matrix.target }} tarball
    permissions:
      contents: read
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ${{ matrix.runner }}
    needs:
      - prepare
      - build
    # Cold `elephc native add curl` builds openssl/zlib/nghttp2/libssh2/curl
    # from source (~6 minutes). A warm cache is a no-op. Other packed
    # bridges still compile-probe in the same job.
    timeout-minutes: 45
    strategy:
      # One incomplete target should still report the state of the other two.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # The probe links real programs, which the build jobs never do on these
      # runners; macOS runners carry the Xcode command line tools already.
      # `build-essential` is also what `elephc native add curl` needs to
      # compile the managed libcurl chain (perl is on the image; openssl's
      # Configure invokes it). Same package set as managed-native-smoke.
      - name: Install a linking toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils build-essential file

      # The probe native-adds curl in its empty WORKDIR before
      # --with-curl, then compile-probes the packed archive. This cache
      # is the default root that add writes (`~/.cache/elephc/native`),
      # keyed like curl-codegen-tests so a warm runner skips the
      # from-source openssl/libcurl rebuild. The compiler itself stays
      # fail-closed for real projects.
      - name: Cache managed native curl/libssh2/nghttp2/openssl/zlib
        uses: actions/cache@v4
        with:
          path: ~/.cache/elephc/native
          key: verify-native-${{ matrix.target }}-${{ hashFiles('examples/curl-get/elephc.lock', 'src/native_deps/catalog.rs', 'src/native_deps/recipes/curl.rs', 'src/native_deps/recipes/libssh2.rs', 'src/native_deps/recipes/nghttp2.rs', 'src/native_deps/recipes/openssl.rs', 'src/native_deps/recipes/zlib.rs', 'src/native_deps/recipes/util.rs') }}
          restore-keys: |
            verify-native-${{ matrix.target }}-

      - name: Download the built tarball
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist

      - name: Verify the tarball is complete
        run: ./scripts/verify-release-artifact.sh "dist/elephc-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"

  release:
    name: Publish release
    # Creates the GitHub release and uploads its assets.
    permissions:
      contents: write
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    needs:
      - build
      - verify-artifact
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        # Pinned to a full commit SHA (v2.6.2) rather than the `v2` tag.
        # This step is the one third-party action that runs while the job
        # holds `contents: write`, so a moved upstream tag would change the
        # code authorised to rewrite this repository's releases, tags and
        # published artifacts without any diff to review here. Both publish
        # paths pin the same SHA; bump them together.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: dist/*

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION_NUM="${VERSION#v}"
          TARBALL="elephc-${VERSION}-aarch64-apple-darwin.tar.gz"
          SHA256=$(awk '{print $1}' "dist/${TARBALL}.sha256")
          URL="https://github.com/illegalstudio/elephc/releases/download/${VERSION}/${TARBALL}"

          # Clone tap repo
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/illegalstudio/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula

          # Generate formula
          cat > /tmp/homebrew-tap/Formula/elephc.rb <<EOF
          class Elephc < Formula
            desc "PHP-to-native compiler targeting macOS ARM64"
            homepage "https://github.com/illegalstudio/elephc"
            url "$URL"
            sha256 "$SHA256"
            version "$VERSION_NUM"
            license "MIT"

            depends_on :macos
            depends_on :arch => :arm64

            def install
              bin.install "elephc"
              lib.install "libelephc_tls.a"
              lib.install "libelephc_pdo.a"
              lib.install "libelephc_crypto.a"
              lib.install "libelephc_bcmath.a"
              lib.install "libelephc_iconv.a"
              lib.install "libelephc_phar.a"
              lib.install "libelephc_tz.a"
              lib.install "libelephc_image.a"
              lib.install "libelephc_probe.a"
              lib.install "libelephc_instr.a"
              lib.install "libelephc_web.a"
              lib.install "libelephc_pcntl.a"
              lib.install "libelephc_magician.a"
              lib.install "libelephc_curl.a"
              lib.install "libelephc_magician_curl.a"
            end

            test do
              (testpath/"hello.php").write('<?php echo "hello";')
              system bin/"elephc", "hello.php"
              assert_equal "hello", shell_output("#{testpath}/hello")

              # Exercise the TLS bridge (https wrapper).
              (testpath/"https.php").write('<?php \$h = fopen("https://example.com/", "r"); echo is_resource(\$h);')
              system bin/"elephc", "https.php"
              assert_predicate testpath/"https", :exist?

              # Exercise the PDO bridge (SQLite driver is bundled; no external
              # DB client or server required). This also validates that
              # libelephc_pdo.a is discoverable in the Homebrew lib/ layout.
              (testpath/"pdo.php").write('<?php \$db = new PDO("sqlite::memory:"); \$db->exec("CREATE TABLE t(id INTEGER)"); echo "pdo-ok";')
              system bin/"elephc", "pdo.php"
              assert_equal "pdo-ok", shell_output("#{testpath}/pdo")

              # Exercise the crypto bridge used by hash()/hash_hmac().
              (testpath/"hash.php").write('<?php echo hash("sha256", "abc");')
              system bin/"elephc", "hash.php"
              assert_equal "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad", shell_output("#{testpath}/hash")

              # Exercise the exact-decimal BCMath bridge.
              (testpath/"bcmath.php").write('<?php echo bcadd("1.25", "2.50", 2);')
              system bin/"elephc", "bcmath.php"
              assert_equal "3.75", shell_output("#{testpath}/bcmath")

              # Exercise the PHAR bridge from the Homebrew lib/ layout.
              (testpath/"phar.php").write('<?php file_put_contents("phar://brew.phar/entry.txt", "phar-ok"); \$p = "brew.phar"; echo file_get_contents("phar://" . \$p . "/entry.txt");')
              system bin/"elephc", "phar.php"
              assert_equal "phar-ok", shell_output("#{testpath}/phar")

              # Exercise the timezone-database bridge (DateTimeZone introspection)
              # from the Homebrew lib/ layout; getLocation() reads libelephc_tz.a.
              (testpath/"tz.php").write('<?php echo (new DateTimeZone("Europe/Rome"))->getLocation()["country_code"];')
              system bin/"elephc", "tz.php"
              assert_equal "IT", shell_output("#{testpath}/tz")

              # Exercise the image bridge (GD) from the Homebrew lib/ layout;
              # validates that libelephc_image.a is discoverable and linked.
              (testpath/"img.php").write('<?php \$im = imagecreatetruecolor(3, 2); echo imagesx(\$im) . "x" . imagesy(\$im);')
              system bin/"elephc", "img.php"
              assert_equal "3x2", shell_output("#{testpath}/img")

              # Exercise the PCNTL bridge from the Homebrew lib/ layout.
              (testpath/"pcntl.php").write('<?php echo pcntl_getpriority();')
              system bin/"elephc", "pcntl.php"
              assert_match(/\A-?\d+\z/, shell_output("#{testpath}/pcntl").strip)

              # Exercise the web bridge link path from the Homebrew lib/ layout.
              (testpath/"web.php").write('<?php echo "web-ok";')
              system bin/"elephc", "--web", "web.php"
              assert_predicate testpath/"web", :exist?
            end
          end
          EOF

          # Push to tap
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/elephc.rb
          git commit -m "Update elephc to ${VERSION}"
          git push
