name: Repository Stats

on:
  schedule:
    - cron: '0 23 * * *' # daily at 23:00 UTC
  workflow_dispatch:

# The commit below is pushed with an Illegal Bot installation token, not the
# workflow token, so `main` can stay protected: the App is the branch ruleset's
# only bypass actor. The default token needs no write access here.
permissions:
  contents: read
  actions: read

concurrency:
  group: repository-stats-publication
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA rather than the `v2` tag: this step receives
      # the App private key, so a moved upstream tag would change the code that
      # handles it without any diff to review here. Every workflow that mints a
      # bot token pins the same SHA; bump them together.
      - name: Mint Illegal Bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ILLEGAL_BOT_APP_ID }}
          private-key: ${{ secrets.ILLEGAL_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch and accumulate clone stats
        env:
          # The traffic API needs `Administration: read`, which the App grants;
          # this replaces the personal access token this step used to carry.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STATS_TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$STATS_TEMP_DIR"' EXIT
          export CLONES_INPUT="$STATS_TEMP_DIR/clones.json"
          gh api repos/${{ github.repository }}/traffic/clones > "$CLONES_INPUT"

          DATA_FILE=.github/traffic/clones.json
          BADGE_FILE=.github/traffic/clones-badge.json
          mkdir -p .github/traffic

          if [ ! -f "$DATA_FILE" ]; then
            echo '{"total_uniques":0,"daily":{}}' > "$DATA_FILE"
          fi

          python3 <<'PYEOF'
          import json
          import os

          with open(os.environ["CLONES_INPUT"]) as f:
              api = json.load(f)

          with open(".github/traffic/clones.json") as f:
              existing = json.load(f)

          daily = existing.get("daily", {})

          for entry in api.get("clones", []):
              date = entry["timestamp"][:10]
              daily[date] = entry["uniques"]

          total = sum(daily.values())

          with open(".github/traffic/clones.json", "w") as f:
              json.dump({"total_uniques": total, "daily": dict(sorted(daily.items()))}, f, indent=2)
              f.write("\n")

          PYEOF

      - name: Download badge SVG
        run: |
          TOTAL=$(python3 -c "import json; print(json.load(open('.github/traffic/clones.json'))['total_uniques'])")
          curl -s "https://img.shields.io/badge/cloners-${TOTAL}-FF7A1A?style=flat-square&logo=git&logoColor=white" -o .github/traffic/clones-badge.svg

      - name: Generate static star history
        run: |
          # The App token, not the workflow token: reading stargazers needs more
          # than the `contents: read` this workflow's token now carries, and the
          # App already holds the metadata access every other step here uses.
          set -o pipefail
          GH_TOKEN="${{ steps.app-token.outputs.token }}" gh api --paginate --slurp \
            -H "Accept: application/vnd.github.star+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${{ github.repository }}/stargazers?per_page=100" \
            | python3 .github/scripts/generate-star-history.py \
                --input - \
                --repository "${{ github.repository }}" \
                --light-output .github/traffic/star-history-light.svg \
                --dark-output .github/traffic/star-history-dark.svg

      - name: Refresh benchmark histories and SVG reports
        env:
          # Artifact reads use the scoped workflow token. Only Git publication
          # uses the existing Illegal Bot installation identity.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B benchmark/fetch.py --repo "${{ github.repository }}"
          python3 -B benchmark/report.py

      - name: Publish updated stats and benchmarks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # The publisher merges measurements into a fresh temporary checkout
          # of main and retries normal pushes if main advances during collection.
          # `[skip ci]` avoids triggering another benchmark/CI run from this App push.
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          python3 -B benchmark/publish.py
