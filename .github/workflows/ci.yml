  # curl fixtures each link the elephc_curl bridge against a real, managed
  # libcurl/libssh2/nghttp2/openssl/zlib build (see
  # tests/codegen/support/curl_native.rs) that the
  # ordinary shards' machines don't provision, so give them their own jobs that
  # materialize that native cache first, cached across runs by an actions/cache keyed
  # on the committed lock plus the recipe sources that decide what gets built. Three
  # things are still unverified going into a first run here -- not reasons to exclude
  # the tests, but the first places to look if this job goes red:
  #   (a) the x86_64 callback trampoline asm cross-assembles but has never actually
  #       executed on real hardware -- codegen::curl::callbacks on
  #       curl-codegen-tests-linux-x86_64 is the first time it runs.
  #   (b) the eval+curl duplicate-symbol link shape (elephc_magician and elephc_curl
  #       both linked into one program, exercised by codegen::curl::eval) is
  #       unverified on the Linux container's toolchain/ld.
  #   (c) this is also the first time `elephc native install` fetches
  #       curl/libssh2/nghttp2/openssl/zlib source over the network and builds it
  #       from scratch *inside* the elephc-ci
  #       container image on Linux -- managed-native-smoke only proves those recipes
  #       on the bare ubuntu-24.04(-arm) runner images (no `container:` there).
  #       openssl's Configure needs `perl`, but that part is not actually at risk:
  #       .github/docker/ci.Dockerfile installs build-essential, which hard-Depends on
  #       dpkg-dev, which hard-Depends on the full `perl` package (Depends install
  #       unconditionally, --no-install-recommends notwithstanding), so perl with every
  #       module Configure needs is already guaranteed present. The genuine unknown is
  #       everything else about a from-source build reaching out over the network from
  #       inside this specific minimal container for the first time.
  curl-codegen-tests-macos-aarch64:
    name: Curl Codegen Tests (macos-aarch64 ${{ matrix.shard }}/4)
    needs: build-archive-macos-aarch64
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install test-only native providers
        run: brew install pcre2

      - name: Cache managed native curl/libssh2/nghttp2/openssl/zlib
        # Deliberately the shared default path (unlike managed-native-smoke, which
        # points ELEPHC_NATIVE_CACHE at an isolated $RUNNER_TEMP dir to prove a
        # from-empty install): here we *want* one warm, reusable cache root that
        # persists across runs via the key below, and it must also be the path
        # `native install` and the skip gate (tests/codegen/support/curl_native.rs)
        # both resolve by default, since no ELEPHC_NATIVE_CACHE override is set.
        uses: actions/cache@v4
        with:
          path: ~/.cache/elephc/native
          key: curl-native-macos-aarch64-${{ hashFiles('examples/curl-get/elephc.lock', 'src/native_deps/catalog.rs', 'src/native_deps/recipes/curl.rs', 'src/native_deps/recipes/libssh2.rs', 'src/native_deps/recipes/nghttp2.rs', 'src/native_deps/recipes/openssl.rs', 'src/native_deps/recipes/zlib.rs', 'src/native_deps/recipes/util.rs') }}
          restore-keys: |
            curl-native-macos-aarch64-

      - name: Download test archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-macos-aarch64
          path: ${{ runner.temp }}

      - name: Extract test archive
        # `elephc` is a build dependency of other integration tests that invoke it via
        # CARGO_BIN_EXE_elephc, so the same nextest archive that carries the
        # codegen_tests binary also carries target/debug/elephc (see the archive
        # notes in .config/nextest.toml) -- one extraction gives us both.
        run: |
          mkdir -p "$RUNNER_TEMP/nextest"
          cargo nextest run --profile ci \
            --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap . \
            --extract-to "$RUNNER_TEMP/nextest" \
            --extract-overwrite --no-run \
            -E 'binary(codegen_tests)'

      - name: Materialize managed native curl (curl, libssh2, nghttp2, openssl, zlib)
        # `install --locked` reproduces exactly the versions pinned in the committed
        # examples/curl-get/elephc.lock (curl 8.21.0, libssh2 1.11.1, nghttp2
        # 1.70.0, openssl 3.5.7, zlib 1.3.2) --
        # more deterministic for a test job than `add`, which resolves against the
        # manifest and can rewrite the lock. Artifacts are content-addressed by
        # (recipe, source sha, target, toolchain fingerprint) under the cache
        # restored above, so this is a fast no-op once warm and only pays the
        # ~4.5 minute from-source build (see managed-native-smoke) on a cold or
        # invalidated cache.
        run: |
          "$RUNNER_TEMP/nextest/target/debug/elephc" native install --locked \
            --target macos-aarch64 \
            --manifest-path examples/curl-get/elephc.toml

      - name: Run curl codegen test shard
        env:
          CARGO_NET_OFFLINE: "true"
          ELEPHC_TEST_PREBUILT_BRIDGES: "1"
        run: |
