  image-api-sync:
    name: Image API stubs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate image API stubs
        # Re-run the generator from its pinned spec; the committed prelude stubs and
        # coverage tests must come back byte-identical. A diff means someone edited
        # the prelude or api_spec.json without regenerating (see
        # crates/elephc-image/tools/README.md).
        run: python3 crates/elephc-image/tools/gen_image_api_stubs.py

      - name: Fail if regeneration changed tracked files
        run: git diff --exit-code -- src/image_prelude.rs tests/codegen/image/

      - name: Check extern/export symbol parity
        # Every `extern "elephc_image"` declaration in the prelude must have a
        # matching #[no_mangle] export in the staticlib, or compiled programs that
        # use the symbol fail to link.
        run: python3 crates/elephc-image/tools/check_extern_exports.py

  builtins-docs-sync:
    name: Builtins docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: rust-builtins-docs-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-builtins-docs-

      - name: Build the builtin docs exporter
        # The exporter joins the shared contract to the AOT `builtin!` and
        # Magician `eval_builtin!` bindings. `extract.py` prefers this prebuilt
        # debug binary, so compile it before any documentation checks.
        #
        # `--features curl` is THE CANONICAL DOCUMENTATION CONFIGURATION, and this
        # job is both the generator and the drift gate, so the two can never
        # diverge. It is the only configuration in which the exporter can see the
        # PHP-visible `curl_*` contracts (feature-gated in the shared catalog) and
        # Magician's matching eval bindings; a default-feature build documents 34
        # fewer functions than the compiler supports. `extract.py` fails loudly
        # rather than regenerate the smaller catalog if this flag is ever dropped.
        run: cargo build --example gen_builtins --features curl

      - name: Enforce builtin target architecture
        run: python3 scripts/audit_builtin_eir_boundary.py --enforce-target-architecture

      - name: Test builtin contract documentation pipeline
        run: python3 -m unittest discover -s scripts/docs/elephc_builtins -p 'test_*.py'

      - name: Regenerate builtins documentation
        # Re-run the generator; the committed Markdown pages and JSON registry
        # must come back byte-identical. A diff means someone changed a builtin
        # signature, lowering, or area assignment without regenerating docs.
        run: python3 scripts/docs/extract_builtins.py --render --force

      - name: Audit generated builtins docs
        run: python3 scripts/docs/audit_builtins.py

      - name: Validate generated docs for site compatibility
        run: python3 scripts/docs/elephc_builtins/validate_site_compat.py

      - name: Run PHP comparison generator tests
        run: python3 -m unittest discover -s scripts/docs -p "test_*.py" -v

      - name: Regenerate the PHP comparison page
        # Joins the freshly regenerated builtin registry with the vendored
        # php_baseline.json snapshot and the curated comparison_catalog.toml.
        # Validates catalog evidence and baseline consistency; the committed
        # page must come back byte-identical.
        run: python3 scripts/docs/gen_php_comparison.py

      - name: Fail if generated docs are out of sync
        run: |
          changes=$(git status --porcelain -- docs/php/builtins.md docs/php/builtins docs/internals/builtins scripts/docs/builtin_registry.json docs/php/compatibility.md)
          if [ -n "$changes" ]; then
            echo "Generated docs are out of sync."
            echo "Run 'python3 scripts/docs/extract_builtins.py --render --force' and"
            echo "'python3 scripts/docs/gen_php_comparison.py', then commit the result."
            echo "$changes"
            exit 1
          fi

  curl-feature-contract:
    name: Curl feature contract coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: rust-curl-feature-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-curl-feature-

      # Every other job builds the workspace with default features, and the
      # nextest archive is no exception, so nothing else in CI ever compiles
      # `elephc-builtin-contract`'s `curl` feature with its tests attached. The
      # gated curl jobs do reach it, but only through the inner `cargo build`
      # in src/linker/bridges.rs, which is compile-only. Without the steps
      # below, adding a `curl_*` eval home with no matching shared contract
      # keeps all of CI green and first fails as a `validate_shared_eval_coverage`
      # panic inside a compiled user program's `eval()`.
      #
      # NO STEP HERE NEEDS A NATIVE libcurl, which is what keeps this job cheap
      # enough to be always-on. The crate-level steps satisfy `curl_ffi`'s
      # `elephc_curl_*` externs from its own `#[cfg(test)] mod test_stubs`; the
      # root-level steps never reach Magician's eval dispatch table at all (they
      # read builtin metadata only), so the linker drops every reference to it.
      - name: Catalog coverage with the curl surface published
        run: cargo test -p elephc-builtin-contract --features curl

      - name: Magician eval bindings with the curl surface published
        run: cargo test -p elephc-magician --features curl

      # The root `curl` feature (Cargo.toml) relays both edges, which is what puts
      # the shared catalog's curl contracts and Magician's eval bindings in ONE
      # process. Only then can the cross-backend parity suite apply its full
      # per-contract assertions — name sets, signature shapes, eval coverage — to
      # the thirty-four `curl_*` surfaces instead of counting them and moving on.
      - name: Cross-backend parity with the curl surface published
        run: cargo test --features curl --test builtin_parity_tests

      # The compiler-side half: `builtins::parity_tests` compares every
      # prelude-provided contract with the PHP declaration its injected prelude
      # actually ships, which is the only AOT signature a prelude route has.
      - name: Compiler prelude parity with the curl surface published
        run: cargo test -p elephc --lib --features curl builtins::parity_tests

  managed-native-smoke:
    name: Managed Native Packages (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-14
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated native cache
        # `runner.temp` is unavailable while GitHub validates job-level `env`;
        # publish the runner-local path once the job is executing instead.
        shell: bash
        run: echo "ELEPHC_NATIVE_CACHE=$RUNNER_TEMP/elephc-managed-native-cache" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: rust-managed-native-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-managed-native-${{ matrix.target }}-

      - name: Install Linux source-build tools
        if: startsWith(matrix.target, 'linux-')
        # Deliberately omit system PCRE2 packages: this smoke must use only the
        # exact shim/POSIX/8-bit archives materialized by `elephc native`.
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils build-essential file

      - name: Build elephc
        run: cargo build --bin elephc

      - name: Verify isolated native cache starts empty
        shell: bash
        run: test ! -e "$ELEPHC_NATIVE_CACHE"

      - name: Materialize catalog PCRE2 from verified source
        shell: bash
        run: |
          ./target/debug/elephc native add pcre2 \
            --target "${{ matrix.target }}" \
            --manifest-path examples/date-json-regex/elephc.toml
          git diff --exit-code -- \
            examples/date-json-regex/elephc.toml \
            examples/date-json-regex/elephc.lock

      - name: Materialize catalog zlib and verify locked offline reuse
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zlib-project"
          ./target/debug/elephc native add zlib \
            --target "${{ matrix.target }}" \
            --manifest-path "$RUNNER_TEMP/zlib-project/elephc.toml"
          ./target/debug/elephc native install \
            --locked \
            --offline \
            --target "${{ matrix.target }}" \
            --manifest-path "$RUNNER_TEMP/zlib-project/elephc.toml"

      - name: Materialize catalog curl (and its libssh2/nghttp2/openssl/zlib dependencies) from verified source
        # curl's recipe declares libssh2, nghttp2, openssl and zlib as
        # dependencies, and libssh2 declares openssl and zlib in turn (see
        # src/native_deps/catalog.rs), so this one `native add` also
        # materializes all four from verified source. A cold build of the whole
        # chain measured ~6 minutes on a fast local machine, comfortably inside
        # this job's timeout; see `crates/elephc-curl/build.rs` for why the
        # elephc_curl BRIDGE staticlib (built via BRIDGE_CRATES elsewhere)
        # still needs these raw libcurl/libssh2/libssl/libcrypto/libz/libnghttp2
        # archives at PHP-program link time even though `cargo build -p
        # elephc-curl` itself does not.
        shell: bash
        run: |
          ./target/debug/elephc native add curl \
            --target "${{ matrix.target }}" \
            --manifest-path examples/curl-get/elephc.toml
          git diff --exit-code -- \
            examples/curl-get/elephc.toml \
            examples/curl-get/elephc.lock

      - name: Compile and run regex through the production resolver
        shell: bash
        run: |
          ./target/debug/elephc \
            --target "${{ matrix.target }}" \
            examples/date-json-regex/main.php
          ./examples/date-json-regex/main > "$RUNNER_TEMP/date-json-regex.out"
          grep -F "Valid email pattern" "$RUNNER_TEMP/date-json-regex.out"
          grep -F "Unicode letters detected" "$RUNNER_TEMP/date-json-regex.out"

      - name: Compile and run curl through the production resolver
        # Exercises the full chain the 194 curl codegen fixtures also need but
        # cannot assume in ordinary CI (see tests/codegen/support/curl_native.rs):
        # the elephc_curl bridge staticlib linked against a real, managed
        # libcurl/libssh2/libssl/libcrypto/libz/libnghttp2. The GET to
        # example.com may or may not reach the network on a given runner, so
        # only network-independent output is asserted — the compiled binary
        # always reaches real curl_exec()/curl_errno()/curl_error() either way.
        shell: bash
        run: |
          ./target/debug/elephc \
            --target "${{ matrix.target }}" \
            examples/curl-get/main.php
          ./examples/curl-get/main > "$RUNNER_TEMP/curl-get.out"
          grep -F "GET http://example.com/" "$RUNNER_TEMP/curl-get.out"
          grep -F "handle still usable after curl_close()" "$RUNNER_TEMP/curl-get.out"
          grep -F "connection refused, as expected" "$RUNNER_TEMP/curl-get.out"

      - name: Reinstall locked state offline
        shell: bash
        run: |
          ./target/debug/elephc native install \
            --locked \
            --offline \
            --target "${{ matrix.target }}" \
            --manifest-path examples/date-json-regex/elephc.toml
          ./target/debug/elephc native install \
            --locked \
            --offline \
            --target "${{ matrix.target }}" \
            --manifest-path examples/curl-get/elephc.toml

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs:
      - build-archive-macos-aarch64
      - build-archive-linux-x86_64
      - build-archive-linux-aarch64
      - non-codegen-tests-macos-aarch64
      - non-codegen-tests-linux-x86_64
      - non-codegen-tests-linux-aarch64
      - web-tests-macos-aarch64
      - web-tests-linux-x86_64
      - web-tests-linux-aarch64
      - codegen-tests-macos-aarch64
      - codegen-tests-linux-x86_64
      - codegen-tests-linux-aarch64
      - pdo-codegen-tests-macos-aarch64
      - pdo-codegen-tests-linux-x86_64
      - pdo-codegen-tests-linux-aarch64
      - curl-codegen-tests-macos-aarch64
      - curl-codegen-tests-linux-x86_64
      - curl-codegen-tests-linux-aarch64
      - eval-codegen-tests-macos-aarch64
      - eval-codegen-tests-linux-x86_64
      - eval-codegen-tests-linux-aarch64
      - image-api-sync
      - builtins-docs-sync
      - managed-native-smoke
      - curl-feature-contract
    if: always()
    steps:
      - name: Verify test jobs
        run: |
          test "${{ needs.build-archive-macos-aarch64.result }}" = "success"
          test "${{ needs.build-archive-linux-x86_64.result }}" = "success"
          test "${{ needs.build-archive-linux-aarch64.result }}" = "success"
          test "${{ needs.non-codegen-tests-macos-aarch64.result }}" = "success"
          test "${{ needs.non-codegen-tests-linux-x86_64.result }}" = "success"
          test "${{ needs.non-codegen-tests-linux-aarch64.result }}" = "success"
          test "${{ needs.web-tests-macos-aarch64.result }}" = "success"
          test "${{ needs.web-tests-linux-x86_64.result }}" = "success"
          test "${{ needs.web-tests-linux-aarch64.result }}" = "success"
          test "${{ needs.codegen-tests-macos-aarch64.result }}" = "success"
          test "${{ needs.codegen-tests-linux-x86_64.result }}" = "success"
          test "${{ needs.codegen-tests-linux-aarch64.result }}" = "success"
          test "${{ needs.pdo-codegen-tests-macos-aarch64.result }}" = "success"
          test "${{ needs.pdo-codegen-tests-linux-x86_64.result }}" = "success"
          test "${{ needs.pdo-codegen-tests-linux-aarch64.result }}" = "success"
          test "${{ needs.curl-codegen-tests-macos-aarch64.result }}" = "success"
          test "${{ needs.curl-codegen-tests-linux-x86_64.result }}" = "success"
          test "${{ needs.curl-codegen-tests-linux-aarch64.result }}" = "success"
          test "${{ needs.eval-codegen-tests-macos-aarch64.result }}" = "success"
          test "${{ needs.eval-codegen-tests-linux-x86_64.result }}" = "success"
          test "${{ needs.eval-codegen-tests-linux-aarch64.result }}" = "success"
          test "${{ needs.image-api-sync.result }}" = "success"
          test "${{ needs.builtins-docs-sync.result }}" = "success"
          test "${{ needs.managed-native-smoke.result }}" = "success"
          test "${{ needs.curl-feature-contract.result }}" = "success"

  benchmark:
    name: Benchmark Suite
    runs-on: macos-14  # Apple Silicon runner
    # The benchmark suite does a full release build and only tracks trends, so it
    # runs on pushes to main rather than on every pull request.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Run benchmark suite
        run: python3 scripts/benchmark_suite.py --iterations 3 --warmup 1 --json benchmark-results.json --markdown benchmark-results.md

      - name: Run magician benchmark suite
        run: python3 scripts/benchmark_magician.py --iterations 3 --warmup 1 --json magician-benchmark-results.json --markdown magician-benchmark-results.md

      - name: Publish benchmark summary
        run: |
          cat benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n## Magician eval benchmark suite\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat magician-benchmark-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            benchmark-results.md
            magician-benchmark-results.json
            magician-benchmark-results.md
