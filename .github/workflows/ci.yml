        # crates/elephc-image/tools/README.md).
        run: python3 crates/elephc-image/tools/gen_image_api_stubs.py

      - name: Fail if regeneration changed tracked files
        run: git diff --exit-code -- src/image_prelude.rs tests/codegen/image/

      - name: Check extern/export symbol parity
        # Every `extern "elephc_image"` declaration in the prelude must have a
        # matching #[no_mangle] export in the staticlib, or compiled programs that
        # use the symbol fail to link.
        run: python3 crates/elephc-image/tools/check_extern_exports.py

  security-audit:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        # The exact toolchain `.github/docker/ci.Dockerfile` pins (RUST_VERSION),
        # selected here through RUST_TOOLCHAIN, not floating `stable`: an unchanged
        # commit must not start failing because a new compiler shipped.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-audit
        # Pinned for the same reason, and `--locked` so its own dependency tree is the
        # reviewed one. Bump both deliberately, in their own PR.
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Cargo.lock against the RustSec database
        # Fails on any advisory that is not listed in `.cargo/audit.toml`, so a NEW
        # vulnerability entering the dependency graph breaks the build instead of being
        # noticed in a periodic manual sweep. Every ignored advisory carries its
        # justification and its removal condition next to it in that file; unmaintained,
        # unsound and yanked notices stay warnings rather than failures, because they have
        # no fixed version to move to and would otherwise make the gate unactionable.
        run: cargo audit

  action-pins:
    name: Third-party Action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test Action pin checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_action_pins.py' -v

      - name: Test macOS notarization gate
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_notarize_macos.py' -v

      - name: Test nextest archive validation
        run: |
          bash scripts/ci/test_validate_nextest_archive.sh
          python3 -B scripts/ci/test_download_test_archive.py

      - name: Check workflow and composite Action refs
        run: ruby .github/scripts/check_action_pins.rb

  builtins-docs-sync:
    name: Builtins docs in sync
    needs: build-curl-tools
    env:
      ELEPHC_DOCS_PREBUILT: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore shared curl docs exporter
        uses: ./.github/actions/restore-build-artifact
        with:
          target: linux-x86_64
          kind: tools
          variant: curl
          features: curl
          attempt: ${{ needs.build-curl-tools.outputs.artifact-attempt }}

      - name: Enforce builtin target architecture
        run: python3 scripts/audit_builtin_eir_boundary.py --enforce-target-architecture

      - name: Regenerate builtins documentation
        # Re-run the generator; the committed Markdown pages and JSON registry
        # must come back byte-identical. A diff means someone changed a builtin
        # signature, lowering, or area assignment without regenerating docs.
        run: python3 scripts/docs/extract_builtins.py --render --force

      - name: Regenerate the module symbol sections
        # Writes the generated "Functions" block (functions, classes, constants per
        # PHP module from the shared catalogs) into each hand-written module page.
        run: python3 scripts/docs/gen_module_sections.py

      - name: Regenerate the PHP comparison page
        # Joins the freshly regenerated builtin and symbol registries with the
        # vendored php_baseline.json snapshot and the curated
        # comparison_catalog.toml. Validates catalog evidence and baseline
        # consistency; the committed page and its compatibility.json twin (read
        # by the elephc.dev site) must come back byte-identical.
        run: python3 scripts/docs/gen_php_comparison.py

      - name: Test builtin contract documentation pipeline
        run: python3 -m unittest discover -s scripts/docs/elephc_builtins -p 'test_*.py'

      - name: Audit generated builtins docs
        run: python3 scripts/docs/audit_builtins.py

      - name: Validate generated docs for site compatibility
        run: python3 scripts/docs/elephc_builtins/validate_site_compat.py

      - name: Run PHP comparison generator tests
        run: python3 -m unittest discover -s scripts/docs -p "test_*.py" -v

      - name: Fail if generated docs are out of sync
        run: |
          changes=$(git status --porcelain -- docs/php docs/internals/builtins scripts/docs/builtin_registry.json scripts/docs/symbol_registry.json)
          if [ -n "$changes" ]; then
            echo "Generated docs are out of sync."
            echo "Run 'python3 scripts/docs/extract_builtins.py --render --force',"
            echo "'python3 scripts/docs/gen_module_sections.py' and"
            echo "'python3 scripts/docs/gen_php_comparison.py', then commit the result."
            echo "$changes"
            exit 1
          fi

      - name: Upload generated builtin documentation
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-builtin-docs
          retention-days: 7
          path: |
            docs/php
            docs/internals/builtins
            scripts/docs/builtin_registry.json
            scripts/docs/symbol_registry.json

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

  tokenizer-tests:
    needs: build-archive-linux-x86_64
    name: Tokenizer PHP 8.5 parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install PHP reference tokenizer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: tokenizer
          coverage: none
      - name: Restore shared tokenizer tests
        uses: ./.github/actions/restore-test-build
        with:
          target: linux-x86_64
          attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}
      - name: Check the shared tokenizer against PHP
        env:
          ELEPHC_TOKENIZER_REQUIRE_PHP85: '1'
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc-tokenizer-engine) and kind(lib)'

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

  tokenizer-native-smoke:
    name: Tokenizer native smoke
    needs: build-archive-linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install stream runtime libraries for opaque eval
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev zlib1g-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Restore shared compiler
        uses: ./.github/actions/restore-build-artifact
        with:
          target: linux-x86_64
          kind: compiler
          attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}
      - name: Restore shared bridges
        uses: ./.github/actions/restore-build-artifact
        with:
          target: linux-x86_64
          kind: bridges
          attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}
      - name: Restore shared tests
        uses: ./.github/actions/restore-test-build
        with:
          target: linux-x86_64
          attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}
      - name: Run the native tokenizer example
        run: |
          target/debug/elephc --with-tokenizer examples/tokenizer/main.php
          trap 'rm -f "$RUNNER_TEMP/tokenizer-example.out"' EXIT
          examples/tokenizer/main > "$RUNNER_TEMP/tokenizer-example.out"
          grep -F 'Function declaration at line 1, byte ' "$RUNNER_TEMP/tokenizer-example.out"
          grep -F 'First token: T_OPEN_TAG' "$RUNNER_TEMP/tokenizer-example.out"
      - name: Run focused native, eval and argument regressions
        run: |
          bash scripts/ci/run_prebuilt_tests.sh 'binary(=codegen_tests) and test(test_tokenizer_)'
          bash scripts/ci/run_prebuilt_tests.sh 'binary(=codegen_tests) and test(=codegen::lfc::lfc_and_strict_php_eval_calls_do_not_leak_profiles)'
          bash scripts/ci/run_prebuilt_tests.sh 'binary(=error_tests) and test(tokenizer_)'
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and kind(lib) and test(=ir_lower::tests::corpus::lowers_tokenizer_example_on_every_target)'
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and kind(lib) and test(=autoload::prelude_probe::tests::probe_detects_tokenizer_in_autoloaded_classes)'
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and kind(lib) and test(=ir_lower::tests::string_offset_lifetime::string_offset_lifetime_stabilizes_views_on_all_targets)'
          bash scripts/ci/run_prebuilt_tests.sh 'binary(=embedder_stack_tests) and test(=prelude_injection_survives_the_nesting_limit_on_a_small_embedder_stack)'

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

  differential-tests:
    name: Differential test run (PHPUnit vs elephc test)
    needs: build-archive-linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Restore shared compiler
        uses: ./.github/actions/restore-build-artifact
        with:
          target: linux-x86_64
          kind: compiler
          attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}

      - name: Restore shared bridges
        uses: ./.github/actions/restore-build-artifact
        with:
          target: linux-x86_64
          kind: bridges
          attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}

      - name: Set up reference PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install PHPUnit for the example suite
        # The example project is the differential fixture: its `*Test.php` files are
        # plain PHP written against PHPUnit's namespace, so the reference run and the
        # compiled run see the same source. vendor/ is created here and never committed.
        run: composer require --dev --no-interaction --quiet phpunit/phpunit
        working-directory: examples/testing

      - name: Compare PHPUnit and elephc test outcomes
        # Every test PHPUnit reports must exist in the compiled run with the same
        # outcome; tests only elephc runs (the .lfc files) are informational.
        run: python3 scripts/test-differential.py examples/testing --elephc target/debug/elephc

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

  curl-feature-contract:
    name: Curl feature contract coverage
    needs: build-curl-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore shared curl contract tests
        uses: ./.github/actions/restore-variant-tests
        with:
          variant: curl
          attempt: ${{ needs.build-curl-tools.outputs.artifact-attempt }}

      # These archives use the curl-enabled shared catalog and Magician bindings.
      # Default host archives cannot cover this feature contract. Crate test stubs
      # satisfy the curl externs, so this consumer needs no native libcurl.
      - name: Catalog coverage with the curl surface published
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc-builtin-contract)'

      - name: Magician eval bindings with the curl surface published
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc-magician)'

      - name: Native reference source and validation ABI
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc-reference)'

      # The root `curl` feature (Cargo.toml) relays both edges, which is what puts
      # the shared catalog's curl contracts and Magician's eval bindings in ONE
      # process. Only then can the cross-backend parity suite apply its full
      # per-contract assertions — name sets, signature shapes, eval coverage — to
      # the thirty-four `curl_*` surfaces instead of counting them and moving on.
      - name: Cross-backend parity with the curl surface published
        run: bash scripts/ci/run_prebuilt_tests.sh 'binary(=builtin_parity_tests)'

      # The compiler-side half: `builtins::parity_tests` compares every
      # prelude-provided contract with the PHP declaration its injected prelude
      # actually ships, which is the only AOT signature a prelude route has.
      - name: Compiler prelude parity with the curl surface published
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and kind(lib) and test(builtins::parity_tests)'

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

  managed-native-smoke-macos-aarch64:
    needs: [plan, build-archive-macos-aarch64]
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/ci-native-smoke.yml
    with:
      target: macos-aarch64
      runner: macos-15
      artifact-attempt: ${{ needs.build-archive-macos-aarch64.outputs.artifact-attempt }}

  managed-native-smoke-linux-x86_64:
    needs: [plan, build-archive-linux-x86_64]
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/ci-native-smoke.yml
    with:
      target: linux-x86_64
      runner: ubuntu-24.04
      artifact-attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}

  managed-native-smoke-linux-aarch64:
    needs: [plan, build-archive-linux-aarch64]
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/ci-native-smoke.yml
    with:
      target: linux-aarch64
      runner: ubuntu-24.04-arm
      artifact-attempt: ${{ needs.build-archive-linux-aarch64.outputs.artifact-attempt }}

  frame-assertions-release:
    name: Frame assertions (release)
    needs: build-release-frame
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore release-mode test executables
        uses: ./.github/actions/restore-variant-tests
        with:
          variant: release-frame
          attempt: ${{ needs.build-release-frame.outputs.artifact-attempt }}

      - name: Check undersized frame rejection in release mode
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and kind(lib) and test(test_emit_frame_)'

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

  benchmark-tooling:
    name: Benchmark tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check benchmark tooling and generated reports
        run: |
          python3 -B -m unittest discover -s benchmark/tests -v
          python3 -B benchmark/report.py
          git diff --exit-code -- benchmark/assets

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs:
      - plan
      - build
      - build-archive-macos-aarch64
      - build-archive-linux-x86_64
      - build-archive-linux-aarch64
      - non-codegen-tests-macos-aarch64
      - non-codegen-tests-linux-x86_64
      - non-codegen-tests-linux-aarch64
      - cli-tests-macos-aarch64
      - cli-tests-linux-x86_64
      - cli-tests-linux-aarch64
      - web-tests-macos-aarch64
      - web-tests-linux-x86_64
      - web-tests-linux-aarch64
      - codegen-tests-macos-aarch64
      - codegen-tests-linux-x86_64
      - codegen-tests-linux-aarch64
      - pdo-codegen-tests-macos-aarch64
      - pdo-codegen-tests-linux-x86_64
      - pdo-codegen-tests-linux-aarch64
      - curl-codegen-tests-macos-aarch64
      - curl-codegen-tests-linux-x86_64
      - curl-codegen-tests-linux-aarch64
      - curl-native-macos-aarch64
      - curl-native-linux-x86_64
      - curl-native-linux-aarch64
      - curl-ios-compile-link
      - xml-ios-compile-link
      - fileinfo-ios-compile-link
      - tokenizer-ios-compile-link
      - gmp-ios-compile-link
      - gmp-phpt-corpus
      - eval-codegen-tests-macos-aarch64
      - eval-codegen-tests-linux-x86_64
      - eval-codegen-tests-linux-aarch64
      - image-api-sync
      - builtins-docs-sync
      - tokenizer-tests
      - tokenizer-native-smoke
      - differential-tests
      - managed-native-smoke-macos-aarch64
      - managed-native-smoke-linux-x86_64
      - managed-native-smoke-linux-aarch64
      - curl-feature-contract
      - security-audit
      - action-pins
      - frame-assertions-release
      - benchmark-tooling
      - phpext-host-sdk
    if: always()
    steps:
      - name: Merge JUnit reports
        # One artifact with every shard's report, so per-test timings for a run can be
        # read in one download instead of ~150. Never fails the gate: the reports are
        # diagnostics, the job results below are the verdict.
        continue-on-error: true
        uses: actions/upload-artifact/merge@v7
        with:
          name: junit-all
          pattern: junit-*
          separate-directories: true
          retention-days: 7

      - name: Verify test jobs
        # The plan job decides which tiers ran; a skipped tier must be skipped, never a quiet
        # failure, and a job in `needs` that none of the lists below classifies fails the gate,
        # so a new job cannot slip past it.
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_TIER: ${{ needs.plan.outputs.run }}
          EXTENDED_TIER: ${{ needs.plan.outputs.extended }}
        run: |
          case "$RUN_TIER/$EXTENDED_TIER" in
            true/true|true/false|false/false) ;;
            *) echo '::error::Missing or invalid tier outputs'; exit 1 ;;
          esac
          always="plan build phpext-host-sdk image-api-sync security-audit action-pins benchmark-tooling"
          run_tier="gmp-phpt-corpus build-archive-macos-aarch64 build-archive-linux-x86_64
            build-archive-linux-aarch64 builtins-docs-sync tokenizer-tests tokenizer-native-smoke differential-tests
            curl-feature-contract frame-assertions-release
            non-codegen-tests-linux-x86_64 non-codegen-tests-linux-aarch64
            cli-tests-linux-x86_64 cli-tests-linux-aarch64 web-tests-linux-x86_64
            web-tests-linux-aarch64 codegen-tests-linux-x86_64 codegen-tests-linux-aarch64
            pdo-codegen-tests-linux-x86_64 pdo-codegen-tests-linux-aarch64
            curl-native-linux-x86_64 curl-native-linux-aarch64 curl-codegen-tests-linux-x86_64
            curl-codegen-tests-linux-aarch64 eval-codegen-tests-linux-x86_64
            eval-codegen-tests-linux-aarch64 managed-native-smoke-macos-aarch64 managed-native-smoke-linux-x86_64 managed-native-smoke-linux-aarch64"
          extended_tier="non-codegen-tests-macos-aarch64 cli-tests-macos-aarch64
            web-tests-macos-aarch64 codegen-tests-macos-aarch64 pdo-codegen-tests-macos-aarch64
            curl-native-macos-aarch64 curl-codegen-tests-macos-aarch64
            eval-codegen-tests-macos-aarch64 curl-ios-compile-link xml-ios-compile-link fileinfo-ios-compile-link tokenizer-ios-compile-link gmp-ios-compile-link"
          in_list() { case " $(echo $2) " in *" $1 "*) return 0 ;; esac; return 1; }
          echo "tiers: run=$RUN_TIER extended=$EXTENDED_TIER"
          status=0
          for job in $(jq -r 'keys[]' <<< "$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")
            if in_list "$job" "$always"; then
              want=success
            elif in_list "$job" "$run_tier"; then
              if [ "$RUN_TIER" = true ]; then want=success; else want=skipped; fi
            elif in_list "$job" "$extended_tier"; then
              if [ "$EXTENDED_TIER" = true ]; then want=success; else want=skipped; fi
            else
              echo "::error::$job is in needs but in none of this gate's tier lists"
              status=1
              continue
            fi
            if [ "$result" != "$want" ]; then
              echo "::error::$job finished $result, expected $want"
              status=1
            fi
          done
          exit "$status"

  development-artifacts:
    name: Development package (${{ matrix.target }})
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.pdo-core-gate.result == 'success' && needs.pdo-drivers-gate.result == 'success'
    needs: [plan, test, pdo-core-gate, pdo-drivers-gate, build-archive-linux-x86_64, build-archive-linux-aarch64, build-archive-macos-aarch64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-15
    uses: ./.github/workflows/ci-package-development.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      source-sha: ${{ github.sha }}
      producer-run: ${{ needs.plan.outputs.reuse-run || github.run_id }}
      producer-attempt: ${{ needs.plan.outputs.reuse-run != '' && fromJSON(needs.plan.outputs.reuse-attempts)[matrix.target] || needs[format('build-archive-{0}', matrix.target)].outputs.artifact-attempt }}

  benchmark:
    needs: build-benchmark
    name: Benchmark Suite
    runs-on: macos-15  # Apple Silicon runner
    env:
      BENCHMARK_RUNNER: macos-15
    # The benchmark suite does a full release build and only tracks trends, so it
    # runs on pushes to main rather than on every pull request.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Set up PHP benchmark baseline
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none
          # benchmark/common.py pins the same OPcache/JIT flags and fails the run if
          # the tracing JIT is not active; this keeps `php --version` metadata consistent.
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M, opcache.file_update_protection=0

      - name: Restore benchmark compiler
        uses: ./.github/actions/restore-build-artifact
        with:
          target: macos-aarch64
          profile: release
          kind: compiler
          attempt: ${{ needs.build-benchmark.outputs.artifact-attempt }}

      - name: Restore benchmark bridges
        uses: ./.github/actions/restore-build-artifact
        with:
          target: macos-aarch64
          profile: release
          kind: bridges
          attempt: ${{ needs.build-benchmark.outputs.artifact-attempt }}

      - name: Run all benchmark suites
        run: python3 -B benchmark/run.py --suite all --require-baselines --no-build --iterations 3 --warmup 1 --json benchmark-results/results.json --markdown benchmark-results/results.md

      - name: Publish benchmark summary
        run: cat benchmark-results/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: error

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds
