  non-codegen-tests-linux-aarch64:
    name: Non-Codegen Tests (linux-aarch64)
    needs: build-archive-linux-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      WASMER_VERSION: 7.2.1
      WASMER_SHA256: 5a434db36f96d483e9967aa1b3ffd129f5b8781ea58faf1b80aeee6f5fb91f63
    container:
      image: ghcr.io/illegalstudio/elephc-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
