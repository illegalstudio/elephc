        uses: ./.github/actions/download-test-archive
        with:
          name: managed-native-curl-macos-aarch64
          path: ${{ runner.temp }}

      - name: Extract managed native curl cache
        run: |
          mkdir -p "$RUNNER_TEMP/elephc-native"
          tar -xzf "$RUNNER_TEMP/managed-native-curl-macos-aarch64.tar.gz" \
            -C "$RUNNER_TEMP/elephc-native" --strip-components=1

      - name: Download test archive
        uses: ./.github/actions/download-test-archive
        with:
          name: nextest-archive-macos-aarch64
          path: ${{ runner.temp }}

      - name: Prepare archived cargo-nextest
        run: chmod 0755 "$RUNNER_TEMP/cargo-nextest"

      - name: Extract test archive
        # `elephc` is a build dependency of other integration tests that invoke it via
        # CARGO_BIN_EXE_elephc, so the same nextest archive that carries the
        # codegen_tests binary also carries target/debug/elephc (see the archive
        # notes in .config/nextest.toml) -- one extraction gives us both.
        run: |
          mkdir -p "$RUNNER_TEMP/nextest"
          "$RUNNER_TEMP/cargo-nextest" nextest run --profile ci \
            --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap . \
            --extract-to "$RUNNER_TEMP/nextest" \
            --extract-overwrite --no-run \
            -E 'binary(codegen_tests)'

      - name: Materialize managed native curl (curl, libssh2, nghttp2, openssl, zlib)
        # `install --locked` reproduces exactly the versions pinned in the committed
        # examples/curl-get/elephc.lock (curl 8.21.0, libssh2 1.11.1, nghttp2
        # 1.70.0, openssl 3.5.8, zlib 1.3.2) --
        # more deterministic for a test job than `add`, which resolves against the
        # manifest and can rewrite the lock. Artifacts are content-addressed by
        # (recipe, source sha, target, toolchain fingerprint) under the cache
        # extracted above. The prerequisite build job owns cold materialization;
        # shards stay offline and fail clearly if artifact provisioning regresses.
        env:
          ELEPHC_NATIVE_CACHE: ${{ runner.temp }}/elephc-native
        run: |
          "$RUNNER_TEMP/nextest/target/debug/elephc" native install --locked --offline \
            --target macos-aarch64 \
            --manifest-path examples/curl-get/elephc.toml

      - name: Run curl codegen test shard
        env:
          CARGO_NET_OFFLINE: "true"
          ELEPHC_NATIVE_CACHE: ${{ runner.temp }}/elephc-native
          ELEPHC_TEST_PREBUILT_BRIDGES: "1"
        run: |
          curl_test_binary="$(find "$RUNNER_TEMP/nextest/target/debug/deps" \
            -type f -name 'codegen_tests-*' -perm -111 -print -quit)"
          test -n "$curl_test_binary"
          bash scripts/ci/run_curl_codegen_shard.sh \
            "$curl_test_binary" "${{ matrix.shard }}" 4

