      - name: Cache managed native libmagic for iOS
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/elephc-native
          key: fileinfo-native-${{ matrix.elephc_target }}-${{ hashFiles('examples/fileinfo/elephc.lock', 'src/native_deps/catalog.rs', 'src/native_deps/recipes/libmagic.rs', 'src/native_deps/recipes/libxml2.rs', 'src/native_deps/recipes/libxml2_shim.c', 'src/native_deps/recipes/util.rs') }}
          restore-keys: |
