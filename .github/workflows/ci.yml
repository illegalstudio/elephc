name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. when a branch is force-pushed or
# rebased) so stale jobs stop consuming runners the moment a newer commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deep parser/lowering fixtures overflow Rust's small default worker stack on
  # ARM64 runners. Keep one value for every archived nextest process so shard
  # placement cannot change whether a test has enough stack.
  RUST_MIN_STACK: "33554432"
  BRIDGE_CRATES: >-
    -p elephc-tls
    -p elephc-pdo
    -p elephc-crypto
    -p elephc-bcmath
    -p elephc-phar
    -p elephc-tz
    -p elephc-image
    -p elephc-magician
    -p elephc-web
    -p elephc-curl

jobs:
  # Compile each platform once, then let that platform's tests start as soon as
  # its archive is uploaded. This avoids a matrix-wide barrier where Linux tests
  # wait for a queued or slower macOS archive job.
  build-archive-macos-aarch64:
    name: Build & Archive Tests (macos-aarch64)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: rust-macos-aarch64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-macos-aarch64-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install native test dependencies
        run: brew install freetds pcre2 unixodbc

      - name: Check (no warnings)
        shell: bash
        run: |
          set -o pipefail
          cargo build 2>&1 | tee "$RUNNER_TEMP/cargo-build.log"
          ! grep -i warning "$RUNNER_TEMP/cargo-build.log"

      - name: Build combined optional PDO driver profile
        run: |
          cargo build -p elephc-pdo --features dblib,firebird,odbc,informix,ibm,sqlsrv,oci,cubrid
          scripts/check_pdo_dblib_symbols.sh target/debug/libelephc_pdo.a
          cargo clean -p elephc-pdo

      - name: Build bridge/native support crates
        # The codegen test runner links compiled programs against bridge
        # staticlibs: libelephc_tls.a (https:// / TLS), libelephc_pdo.a (PDO),
        # libelephc_crypto.a (hash / HMAC family), libelephc_bcmath.a (BCMath),
        # libelephc_phar.a (PHAR),
        # libelephc_tz.a (DateTimeZone introspection), libelephc_image.a
        # (GD / Exif / Imagick / Gmagick / Cairo), libelephc_magician.a (eval),
        # libelephc_web.a, and libelephc_curl.a (curl; its symbols stay
        # unresolved until a PHP-program link pulls in a real managed
        # libcurl/libssh2/libssl/libcrypto/libz/libnghttp2, see
        # managed-native-smoke). Build
        # them before archiving so the archive can capture the .a files (see the
        # archive include list in .config/nextest.toml).
        run: cargo build $BRIDGE_CRATES

      - name: Build curl-aware magician staticlib
        # elephc-magician's DEFAULT build (just above, part of $BRIDGE_CRATES) never
        # compiles curl's eval homes in at all, so a fixture that needs curl reachable
        # from eval() needs a SEPARATE archive built `--features curl` -- and that
        # build must land at a DISTINCT filename (libelephc_magician_curl.a), built
        # into an ISOLATED --target-dir, never written in-place over the plain
        # libelephc_magician.a every curl-free eval fixture also needs from this same
        # archive (Cargo does not vary a staticlib's output filename by feature set).
        # Mirrors tests/codegen/support/runner.rs's ensure_magician_curl_staticlib and
        # the production src/linker/bridges.rs build exactly, for the identical
        # reason documented on both. Must run before "Archive test binaries" below so
        # the resulting file exists at archive time (see the new
        # [[profile.ci.archive.include]] entry for it in .config/nextest.toml) --
        # without it, curl-codegen-tests shards (offline, no cargo registry cache)
        # cannot build this themselves on demand.
        run: |
          cargo build -p elephc-magician --features curl \
            --target-dir target/elephc-magician-curl-test-build
          cp target/elephc-magician-curl-test-build/debug/libelephc_magician.a \
            target/debug/libelephc_magician_curl.a

      - name: Archive test binaries
        run: cargo nextest archive --profile ci --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      - name: Run doctests
        # Doctests cannot run from a nextest archive, so run them here where the
        # workspace is already built.
        run: cargo test --workspace --doc

      - name: Upload test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-macos-aarch64
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1
          if-no-files-found: error

  build-archive-linux-x86_64:
    name: Build & Archive Tests (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Every Linux job runs inside the prebuilt CI image (multi-arch, built by
    # ci-image.yml from .github/docker/ci.Dockerfile): the native deps, the
    # pinned Rust toolchain, and cargo-nextest are baked in, replacing the
    # per-job apt-get/rustup/nextest install steps that cost ~150s per job on
    # the arm runners.
    container:
      image: ghcr.io/illegalstudio/elephc-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust build state
        uses: actions/cache@v4
