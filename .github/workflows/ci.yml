      - name: Build combined optional PDO driver profile
        run: |
          cargo build -p elephc-pdo --features dblib,firebird,odbc,informix,ibm,sqlsrv,oci,cubrid
          scripts/check_pdo_dblib_symbols.sh target/debug/libelephc_pdo.a
          cargo clean -p elephc-pdo

      - name: Build bridge/native support crates
        # The codegen test runner links compiled programs against bridge
        # staticlibs: libelephc_tls.a (https:// / TLS), libelephc_pdo.a (PDO),
        # libelephc_crypto.a (hash / HMAC family), libelephc_bcmath.a (BCMath),
        # libelephc_phar.a (PHAR),
        # libelephc_tz.a (DateTimeZone introspection), libelephc_image.a
        # (GD / Exif / Imagick / Gmagick / Cairo), libelephc_magician.a (eval),
        # libelephc_web.a, and libelephc_curl.a (curl; its symbols stay
        # unresolved until a PHP-program link pulls in a real managed
        # libcurl/libssh2/libssl/libcrypto/libz/libnghttp2, see
        # managed-native-smoke). Build
        # them before archiving so the archive can capture the .a files (see the
        # archive include list in .config/nextest.toml).
        run: cargo build $BRIDGE_CRATES

      - name: Build curl-aware magician staticlib
        # elephc-magician's DEFAULT build (just above, part of $BRIDGE_CRATES) never
        # compiles curl's eval homes in at all, so a fixture that needs curl reachable
        # from eval() needs a SEPARATE archive built `--features curl` -- and that
