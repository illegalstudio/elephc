          name: nextest-archive-macos-aarch64
          path: ${{ runner.temp }}

      - name: Prepare archived cargo-nextest
        run: chmod 0755 "$RUNNER_TEMP/cargo-nextest"

      - name: Cache managed native libxml2
        # tests/codegen/xml fixtures link the elephc_xml bridge against the managed
        # libxml2 artifact (see tests/codegen/support/xml_native.rs). Same key as the
        # build-archive job that already materialized it, so this is a restore.
