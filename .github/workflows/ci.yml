      - name: Restore shared iOS bridges
        uses: ./.github/actions/restore-build-artifact
        with:
          target: ${{ matrix.elephc_target }}
          kind: ios
          attempt: ${{ fromJSON(needs.build-ios.outputs.artifact-attempts)[matrix.elephc_target] }}

      - name: Cache managed native GMP for iOS
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/elephc-native
          key: gmp-native-${{ matrix.elephc_target }}-${{ hashFiles('examples/gmp/elephc.lock', 'src/native_deps/catalog.rs', 'src/native_deps/recipes/gmp.rs', 'src/native_deps/recipes/mod.rs', 'src/native_deps/recipe.rs', 'src/native_deps/recipes/util.rs') }}
          restore-keys: |
