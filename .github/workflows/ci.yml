          path: ~/.cache/elephc/native
          key: libxml2-native-macos-aarch64-${{ hashFiles('examples/xml/elephc.lock', 'src/native_deps/catalog.rs', 'src/native_deps/recipes/libxml2.rs', 'src/native_deps/recipes/libxml2_shim.c', 'src/native_deps/recipes/util.rs') }}
          restore-keys: |
            libxml2-native-macos-aarch64-

      - name: Extract test archive
        # The same nextest archive that carries the codegen_tests binary also carries
        # target/debug/elephc (see the archive notes in .config/nextest.toml); the
        # compiler is what materializes the managed package below.
        run: |
          mkdir -p "$RUNNER_TEMP/nextest"
          "$RUNNER_TEMP/cargo-nextest" nextest run --profile ci \
            --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap . \
            --extract-to "$RUNNER_TEMP/nextest" \
            --extract-overwrite --no-run \
            -E 'binary(codegen_tests)'

      - name: Materialize managed native libxml2
        # A no-op on the warm cache restored above; otherwise the pinned
        # examples/xml/elephc.lock build from source (~1 minute).
        run: |
          "$RUNNER_TEMP/nextest/target/debug/elephc" native install --locked \
            --target macos-aarch64 \
            --manifest-path examples/xml/elephc.toml

      - name: Run codegen test shard
        env:
