  # iOS cannot run as a standalone elephc executable, but curl is still a first-class
  # dependency of exported iOS staticlibs. Build the complete managed native chain with
  # the real Xcode toolchain, prove libcurl contains AppleSecTrust, cross-build the Rust
  # bridge, compile a curl-using PHP library, and perform the final application-host link
  # for both device and Simulator. A recipe that silently falls back to Unix PEM probing,
  # or misses a framework/archive on either platform, fails here.
  curl-ios-compile-link:
    name: Curl iOS Compile & Link (${{ matrix.elephc_target }})
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - elephc_target: ios-arm64
            rust_target: aarch64-apple-ios
            sdk: iphoneos
            clang_target: arm64-apple-ios13.0
          - elephc_target: ios-sim-arm64
            rust_target: aarch64-apple-ios-sim
            sdk: iphonesimulator
            clang_target: arm64-apple-ios13.0-simulator
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with the iOS standard library
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: rust-curl-${{ matrix.elephc_target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-curl-${{ matrix.elephc_target }}-

      - name: Cache managed native curl for iOS
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/elephc-native
          key: curl-native-${{ matrix.elephc_target }}-${{ hashFiles('examples/curl-get/elephc.lock', 'src/native_deps/catalog.rs', 'src/native_deps/recipes/curl.rs', 'src/native_deps/recipes/libssh2.rs', 'src/native_deps/recipes/nghttp2.rs', 'src/native_deps/recipes/openssl.rs', 'src/native_deps/recipes/zlib.rs', 'src/native_deps/recipes/util.rs') }}
          restore-keys: |
            curl-native-${{ matrix.elephc_target }}-

      - name: Build and link curl with native iOS trust
        env:
          ELEPHC_NATIVE_CACHE: ${{ runner.temp }}/elephc-native
        run: |
          bash scripts/ci/test_ios_curl_link.sh \
            "${{ matrix.elephc_target }}" \
            "${{ matrix.rust_target }}" \
            "${{ matrix.sdk }}" \
            "${{ matrix.clang_target }}"

  # Same shape for the xml bridge: build the managed libxml2 package (with its Elephc
  # shim) using the real Xcode toolchain, cross-build the Rust xml bridge (and the phar
  # bridge the xml prelude's fopen() drags in through the runtime's stream layer),
  # compile a PHP library that uses both halves — the SAX parser with handlers and
  # XMLWriter — and perform the final application-host link for both device and
  # Simulator. A recipe that loses the platform iconv, or a link plan missing the shim,
  # libxml2, `-liconv`, or the SDK's zlib/bzip2 on either platform, fails here.
  xml-ios-compile-link:
    name: XML iOS Compile & Link (${{ matrix.elephc_target }})
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
