      - name: Build and link gmp with the managed libgmp
        env:
          ELEPHC_NATIVE_CACHE: ${{ runner.temp }}/elephc-native
        run: |
          bash scripts/ci/test_ios_gmp_link.sh \
            "${{ matrix.elephc_target }}" "${{ matrix.rust_target }}" \
            "${{ matrix.sdk }}" "${{ matrix.clang_target }}"

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

  tidy-ios-compile-link:
