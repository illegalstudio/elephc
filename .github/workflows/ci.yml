  curl-native-macos-aarch64:
    name: Managed Native curl (macos-aarch64)
    needs: [plan, build-archive-macos-aarch64]
    if: needs.plan.outputs.extended == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download test archive
        uses: ./.github/actions/download-test-archive
        with:
          name: nextest-archive-codegen-macos-aarch64
          attempt: ${{ needs.build-archive-macos-aarch64.outputs.artifact-attempt }}
          path: ${{ runner.temp }}

      - name: Validate archived cargo-nextest
        id: validate_archived_nextest
        continue-on-error: true
        run: |
          sh scripts/ci/validate_archived_nextest.sh "$RUNNER_TEMP"

      - name: Remove invalid cargo-nextest
        if: steps.validate_archived_nextest.outcome == 'failure'
        run: rm -f "$RUNNER_TEMP/cargo-nextest"

      - name: Retry cargo-nextest artifact download
        if: steps.validate_archived_nextest.outcome == 'failure'
        uses: ./.github/actions/download-test-archive
        with:
          name: nextest-archive-codegen-macos-aarch64
          attempt: ${{ needs.build-archive-macos-aarch64.outputs.artifact-attempt }}
          path: ${{ runner.temp }}

      - name: Validate retried cargo-nextest
        if: steps.validate_archived_nextest.outcome == 'failure'
        run: |
          sh scripts/ci/validate_archived_nextest.sh "$RUNNER_TEMP"

      - name: Extract the elephc binary
        # The archive carries target/debug/elephc next to the test binaries (see the
        # archive notes in .config/nextest.toml); only the binary is needed here.
        run: |
          mkdir -p "$RUNNER_TEMP/nextest"
          "$RUNNER_TEMP/cargo-nextest" nextest run --profile ci \
            --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap . \
            --extract-to "$RUNNER_TEMP/nextest" \
            --extract-overwrite --no-run \
            -E 'binary(codegen_tests)'

      - name: Cache managed native curl/libssh2/nghttp2/openssl/zlib
        # Cross-run cache keyed on the committed lock plus the recipe sources that
        # decide what gets built; a cold key costs one source build here instead of
        # four concurrent ones in the shards.
        uses: actions/cache@v6
        with:
          path: ~/.cache/elephc/native
          key: curl-native-macos-aarch64-${{ hashFiles('examples/curl-get/elephc.lock', 'src/native_deps/catalog.rs', 'src/native_deps/recipes/curl.rs', 'src/native_deps/recipes/libssh2.rs', 'src/native_deps/recipes/nghttp2.rs', 'src/native_deps/recipes/openssl.rs', 'src/native_deps/recipes/zlib.rs', 'src/native_deps/recipes/util.rs') }}
          restore-keys: |
            curl-native-macos-aarch64-

      - name: Materialize managed native curl
        run: |
          "$RUNNER_TEMP/nextest/target/debug/elephc" native install --locked \
            --target macos-aarch64 \
            --manifest-path examples/curl-get/elephc.toml

      - name: Pack managed native curl cache
        run: |
          tar -C "$HOME/.cache/elephc" -czf \
            "$RUNNER_TEMP/managed-native-curl-macos-aarch64.tar.gz" native

      - name: Upload managed native curl cache
        uses: actions/upload-artifact@v7
        with:
          name: managed-native-curl-macos-aarch64
          path: ${{ runner.temp }}/managed-native-curl-macos-aarch64.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

