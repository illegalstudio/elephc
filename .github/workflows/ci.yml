        run: |
          bash scripts/ci/test_ios_fileinfo_link.sh \
            "${{ matrix.elephc_target }}" \
            "${{ matrix.rust_target }}" \
            "${{ matrix.sdk }}" \
            "${{ matrix.clang_target }}"

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

  gmp-phpt-corpus:
    name: GMP PHPT corpus
    needs: [plan, build-archive-linux-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The prebuilt CI image already carries the pinned Rust toolchain, m4 and the
    # native build dependencies, so this job needs no per-run apt-get step.
    env:
      ELEPHC_CI_IMAGE: ${{ needs.plan.outputs.ci-image }}
    container:
      image: ${{ needs.plan.outputs.ci-image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Ensure GMP configure dependency
        # The image contract includes m4; provisioning belongs to its build.
        run: command -v m4

      - name: Restore shared compiler
        uses: ./.github/actions/restore-build-artifact
        with:
          target: linux-x86_64
          kind: compiler
          attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}

      - name: Restore shared bridges
        uses: ./.github/actions/restore-build-artifact
        with:
          target: linux-x86_64
          kind: bridges
          attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}

      - name: Restore shared tests
        uses: ./.github/actions/restore-test-build
        with:
          target: linux-x86_64
          attempt: ${{ needs.build-archive-linux-x86_64.outputs.artifact-attempt }}

      - name: Materialize managed GMP
        run: |
          ./target/debug/elephc native install --locked \
            --manifest-path examples/gmp/elephc.toml

      - name: Run the whole ext/gmp PHPT corpus
        env:
          ELEPHC_TEST_REQUIRE_GMP_NATIVE: "1"
        run: |
          bash scripts/ci/run_prebuilt_tests.sh \
            'binary(=codegen_tests) and test(test_gmp_php_src_phpt_corpus)' --run-ignored only --nocapture

      - name: Audit consumer compilation
        if: always()
        uses: ./.github/actions/assert-consumer-builds

