name: PDO Live Databases

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: pdo-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-host:
    uses: ./.github/workflows/ci-build-host.yml
    with:
      target: linux-x86_64

  build-libpq:
    needs: build-host
    uses: ./.github/workflows/ci-build-pdo.yml
    with:
      host-attempt: ${{ needs.build-host.outputs.artifact-attempt }}
      variants: '["libpq-gss"]'

  test-libpq:
    needs: build-libpq
    uses: ./.github/workflows/ci-test-pdo.yml
    with:
      family: core
      variant-attempt: ${{ needs.build-libpq.outputs.artifact-attempt }}

  build-drivers:
    needs: build-host
    uses: ./.github/workflows/ci-build-pdo.yml
    with:
      host-attempt: ${{ needs.build-host.outputs.artifact-attempt }}
      variants: '["sqlsrv","oci","cubrid","dblib","firebird","odbc","informix","ibm"]'

  test-drivers:
    needs: build-drivers
    uses: ./.github/workflows/ci-test-pdo.yml
    with:
      family: drivers
      variant-attempt: ${{ needs.build-drivers.outputs.artifact-attempt }}
