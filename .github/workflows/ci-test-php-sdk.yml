name: Test PHP host SDK

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      artifact-attempt:
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '4'
  RUST_MIN_STACK: '33554432'

jobs:
  host-sdk:
    name: Host SDK (${{ inputs.target }}, ${{ matrix.phpts }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        phpts: [nts, ts]
    env:
      ELEPHC_PHPEXT_EXPECT_ZTS: ${{ matrix.phpts == 'ts' && '1' || '0' }}
      ELEPHC_PHPEXT_EXPECT_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: '1.98'

      - name: Install matching PHP 8.5 SDK and CLI
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
        env:
          phpts: ${{ matrix.phpts }}
          fail-fast: 'true'

      - name: Restore compiler
        uses: ./.github/actions/restore-build-artifact
        with:
          target: ${{ inputs.target }}
          kind: compiler
          attempt: ${{ inputs.artifact-attempt }}

      - name: Restore bridges
        uses: ./.github/actions/restore-build-artifact
        with:
          target: ${{ inputs.target }}
          kind: bridges
          attempt: ${{ inputs.artifact-attempt }}

      - name: Restore Rust tests
        uses: ./.github/actions/restore-test-build
        with:
          target: ${{ inputs.target }}

      - name: Verify runner and selected interpreter
        shell: bash
        run: |
          set -euo pipefail
          php -n -r 'if (PHP_VERSION_ID < 80500 || PHP_VERSION_ID >= 80600 || (int) PHP_ZTS !== (int) getenv("ELEPHC_PHPEXT_EXPECT_ZTS")) { exit(1); }'
          echo "ELEPHC_PHPEXT_PHP_BINARY=$(command -v php)" >> "$GITHUB_ENV"
          php-config --vernum
          php -n -v

      - name: Check SDK parsing, host build and warning cleanup
        run: |
          python3 -m unittest discover -s scripts/phpext -p test_embed_runner.py
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=elephc) and test(phpext::)'
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=elephc) and test(warning_dispatch_emits_every_supported_target)'
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=elephc) and test(nested_boundary_reads_linked_concat_capacity_on_all_targets)'
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=elephc) and test(hosted_fatal_paths_escape_before_raw_diagnostics)'
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=elephc) and test(phpext_pack_rejects_non_php_tags_before_normalization)'

      - name: Check consumer ABI after sharing value-layout facts
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc-zend) and binary(=abi) and test(structures_have_the_layout_rust_gives_them)'

      # These are explicit real-host tests. A missing SDK must fail, not skip.
      - name: Verify real PHP SDK, compiled exports, ownership and output
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=phpext_tests)' --run-ignored all

      - name: Check existing library outputs
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=cdylib_tests) and test(test_cdylib_builds_and_host_calls_exports)'

      - name: Check static archive output
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=cdylib_tests) and test(test_staticlib_links_directly_into_a_host_binary)'

      - name: Check iOS library emitter contracts
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=cdylib_tests) and test(test_ios_aarch64_emit_asm_pins_string_return_out_parameters)'

      - name: Install Valgrind for native and adapter memory checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind libc6-dbg

      - name: Cache real PHP debug embed SDK
        uses: actions/cache@v6
        with:
          # Keep the non-relocatable SDK outside Rust's target cache. Both the
          # builder identity and its workflow configure flags invalidate this cache.
          path: ${{ runner.temp }}/phpext-test-host
          key: phpext-embed-${{ inputs.target }}-${{ matrix.phpts }}-${{ hashFiles('scripts/phpext/build_host.py', '.github/workflows/phpext-host-sdk.yml') }}-v3

      - name: Build real PHP debug CLI and embed SDK
        shell: bash
        run: |
          set -euo pipefail
          flags=(--prefix "$RUNNER_TEMP/phpext-test-host" --debug)
          if [ '${{ matrix.phpts }}' = ts ]; then
            flags+=(--zts)
          fi
          if [ '${{ runner.os }}' = Linux ]; then
            flags+=(--with-valgrind)
          fi
          python3 scripts/phpext/build_host.py "${flags[@]}"

      - name: Verify repeated requests and concurrent ZTS requests in real PHP
        run: python3 scripts/phpext/test_embed.py --php-config "$RUNNER_TEMP/phpext-test-host/bin/php-config"

      - name: Check native and adapter leaks with Valgrind
        if: runner.os == 'Linux'
        run: python3 scripts/phpext/test_embed.py --php-config "$RUNNER_TEMP/phpext-test-host/bin/php-config" --valgrind

      - name: Check native and adapter leaks with Apple leaks
        if: runner.os == 'macOS'
        run: python3 scripts/phpext/test_embed.py --php-config "$RUNNER_TEMP/phpext-test-host/bin/php-config" --leaks

      - name: Check macOS lifecycle across independent module builds
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            echo "macOS lifecycle build $attempt/8"
            python3 scripts/phpext/test_embed.py --php-config "$RUNNER_TEMP/phpext-test-host/bin/php-config" --leaks
          done

      - name: Check standalone null declaration parsing
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=parser_tests) and test(standalone_null)'

      - name: Check standalone warning cleanup and default output
        run: |
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=codegen_tests) and test(test_core_error_regression_ordinary_warning_unwind)'
          bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=codegen_tests) and test(test_core_warning_fragments_newline_key_default_output)'

      - name: Check standalone null declarations in executable output
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=codegen_tests) and test(test_standalone_null_parameters_and_returns)'

      - name: Check standalone null and void diagnostics
        run: bash scripts/ci/run_prebuilt_tests.sh 'package(=elephc) and binary(=error_tests) and test(test_standalone_null_return_requirements)'
