name: Mirrors

# Publishes directories of this repository to their read-only mirrors in the getelephc
# organization (see "Read-only mirrors" in CONTRIBUTING.md). Pull requests dry-run every
# split; a push to the canonical `main` publishes through the shared subtree-mirror action.

on:
  push:
    branches: [main]
    paths:
      - showcases/doom/**
      - .github/workflows/mirrors.yml
  pull_request:
    paths:
      - showcases/doom/**
      - .github/workflows/mirrors.yml
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish half-way, and keep two pushes from racing on the same mirror.
concurrency:
  group: mirrors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate ${{ matrix.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: &mirrors
          # `history` is chosen once per mirror: preserve can later become flatten, never
          # the reverse.
          - prefix: showcases/doom
            repository: getelephc/doom
            history: preserve
    steps:
      - uses: actions/checkout@v7
        with:
          # The split walks the whole history of each directory.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate ${{ matrix.prefix }} without publishing
        uses: illegalstudio/.github/actions/subtree-mirror@0a0e4eb099d4f8799dbd7217fd4a76718dfbe908
        with:
          prefix: ${{ matrix.prefix }}
          repository: ${{ matrix.repository }}
          history: ${{ matrix.history }}

  publish:
    name: Publish ${{ matrix.repository }}
    needs: test
    if: github.repository == 'illegalstudio/elephc' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: *mirrors
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish ${{ matrix.prefix }} to its mirror
        uses: illegalstudio/.github/actions/subtree-mirror@0a0e4eb099d4f8799dbd7217fd4a76718dfbe908
        with:
          prefix: ${{ matrix.prefix }}
          repository: ${{ matrix.repository }}
          history: ${{ matrix.history }}
          push: true
          app-id: ${{ secrets.ELEPHC_BOT_APP_ID }}
          private-key: ${{ secrets.ELEPHC_BOT_PRIVATE_KEY }}
          # The mirrored directory carries its own .github/workflows.
          workflows: true
